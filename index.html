<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mortal Online 2 — Extraction Chain Calculator</title>

<style>
  :root {
    --bg0: #0d0f14;
    --bg1: #1a1c22;
    --bg2: #12141a;
    --bg3: #1e2028;
    --border: #2e3140;
    --text1: #e8eaf0;
    --text2: #8891a8;
    --text3: #4e5570;
    --info-bg: #1a2a3a;
    --info-text: #5ba8f5;
    --green: #1D9E75;
    --blue: #378ADD;
    --purple: #7F77DD;
    --gold: #c9a227;
    --r-lg: 10px;
    --r-md: 6px;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg0); color: var(--text1); min-height: 100vh; padding: 24px 16px; }
  input, select {
    background: var(--bg2); border: 1px solid var(--border);
    color: var(--text1); border-radius: var(--r-md);
    padding: 7px 10px; font-size: 13px; outline: none; width: 100%;
  }
  input:focus, select:focus { border-color: #378ADD66; }
  select option { background: var(--bg1); }
  button { font-family: inherit; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
  .tab-btn {
    padding: 8px 18px; font-size: 13px; font-weight: 500;
    background: none; border: none; cursor: pointer;
    color: var(--text2); border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all 0.15s;
  }
  .tab-btn:hover { color: var(--text1); }
  .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }

  /* Buff bar */
  .buff-toggle {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 13px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--bg2);
    color: var(--text2); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .buff-toggle:hover { border-color: #378ADD55; color: var(--text1); }
  .buff-toggle.active-cm  { background: #1a2e1f; border-color: var(--green); color: var(--green); }
  .buff-toggle.active-cmo { background: #1e2538; border-color: var(--blue);  color: var(--blue);  }
  .buff-toggle .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.7; }
  .buff-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--bg2);
    border: 0.5px solid var(--border); border-radius: var(--r-lg); margin-bottom: 18px;
  }
  .buff-label { font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text3); margin-right: 2px; }
  .buff-active-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; margin-left: auto; }
  .buff-active-badge.cm  { background: #1a2e1f; color: var(--green); }
  .buff-active-badge.cmo { background: #1e2538; color: var(--blue);  }

  /* Danger toggle */

    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--bg2);
    border: 0.5px solid var(--border); border-radius: var(--r-lg); margin-bottom: 18px;

  .danger-label { font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text3); }

    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text2); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; white-space: nowrap; user-select: none;

  .danger-toggle.on  { background: #2a1a14; border-color: #e05a3a; color: #e05a3a; }
  .danger-toggle.off { background: #1a2e1f; border-color: var(--green); color: var(--green); }

    width: 28px; height: 15px; border-radius: 8px; background: currentColor;
    opacity: 0.3; position: relative; transition: all 0.15s; flex-shrink: 0;

    position: absolute; top: 2px; width: 11px; height: 11px;
    border-radius: 50%; background: currentColor; opacity: 1;
    transition: left 0.15s;

  .rs-ingredient-row {

  .section-toggle.open { border-radius: var(--r-lg) var(--r-lg) 0 0; border-bottom: none; margin-bottom: 0; }
  .section-body {
    background: var(--bg1); border: 0.5px solid var(--border);
    border-top: none; border-radius: 0 0 var(--r-lg) var(--r-lg);

  .danger-warning {
    background: #2a1a0a; border: 1px solid #e05a3a;
    border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 14px;

  .danger-warning-row { font-size: 12px; color: #c8a07a; padding: 3px 0; border-bottom: 0.5px solid #3a2010; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .danger-warning-row:last-child { border-bottom: none; }
  .danger-warning-highlight { color: #e05a3a; font-weight: 600; }
  /* Sticky footer credits */
  .credits-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #0d0f14ee;
    border-top: 1px solid var(--border);
    backdrop-filter: blur(8px);
    padding: 7px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    z-index: 999;
    font-size: 11px;
  }
  .credits-bar .by { color: var(--text1); font-weight: 600; }
  .credits-bar .sep { color: var(--border); margin: 0 2px; }
  .credits-bar .dim { color: var(--text3); }
  .credits-bar .val { color: var(--text2); }
  .credits-bar a { color: var(--info-text); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.15s; }
  .credits-bar a:hover { border-bottom-color: var(--info-text); }
  #root { padding-bottom: 44px; }
</style>

// Image table: Recipe=output, col2=x2, col1=x1, col1=x1
const REFINING_RECIPES = {

  Messing:       { ingredients: [["Cuprum",2],["Calamine",1],["Saburra Powder",1]] },
  "Tind Messing":{ ingredients: [["Messing",2],["Almine",1],["Gem Metal",1]] },
  "Grain Steel": { ingredients: [["Pig Iron",2],["Calx Powder",1],["Coke",1]] },
  Steel:         { ingredients: [["Grain Steel",2],["Coal",1],["Saburra Powder",1]] },
  Tungsteel:     { ingredients: [["Grain Steel",2],["Lupium",1],["Granum Powder",1]] },
  Cronite:       { ingredients: [["Grain Steel",2],["Almine",1],["Acronite",1]] },
  Oghmium:       { ingredients: [["Tungsteel",2],["Cronite",1],["Sanguinite",1]] },

// For the reverse search, we need to know which ore + recipe yields each ingredient.
// Build a lookup: material -> list of { ore, recipeIdx, ratio (per 10000 of ore) }

// Returns true if using Coke/Rock Oil for a from→to step is a meaningful practical tradeoff,
// meaning there exists a higher-yield option that does NOT use a practical catalyst.
// If ALL top options already use Coke/Rock Oil, it's not a tradeoff — don't flag it.
function isStepPractical(fromNode, toMat, catalyst, allowDangerous) {
  const cn = parseCatalystName(catalyst);
  if (cn !== "Rock Oil" && cn !== "Coke") return false;
  const srcRecs = [...(RECIPES[fromNode]||[]), ...(SUB_RECIPES[fromNode]||[])];
  const options = srcRecs.filter(r =>
    r.outputs[toMat] !== undefined &&
    !RARE_CATALYSTS.has(parseCatalystName(r.catalyst)) &&
    (!allowDangerous ? !DANGEROUS_MACHINES.has(r.machine) : true)
  );
  if (options.length <= 1) return false;
  const bestRatio = Math.max(...options.map(r => r.outputs[toMat]));
  // Check if ALL options at best ratio use a practical catalyst
  // If even ONE top option uses a non-practical catalyst, flagging is meaningful
  const topOptions = options.filter(r => r.outputs[toMat] === bestRatio);
  const allTopArePractical = topOptions.every(r => {
    const c = parseCatalystName(r.catalyst);
    return c === "Rock Oil" || c === "Coke";
  });
  return !allTopArePractical;
}

// Catalysts that are too rare/expensive to use in auto-routing
const RARE_CATALYSTS = new Set(["Glimmer Powder"]);

function buildExtractionIndex(allowDangerous, allowKimurite) {
  const idx = {};
  const addEntry = (material, source) => {
    if (!allowDangerous && DANGEROUS_MACHINES.has(source.machine)) return;
    const sourceOre = source.type === "ore" ? source.ore : source.input;
    if (!allowKimurite && sourceOre === "Kimurite") return;
    if (RARE_CATALYSTS.has(parseCatalystName(source.catalyst))) return;
    if (!idx[material]) idx[material] = [];
    idx[material].push(source);
  };
  Object.entries(RECIPES).forEach(([ore, recipes]) => {
    recipes.forEach((r, ri) => {
      Object.entries(r.outputs).forEach(([mat, ratio]) => {
        addEntry(mat, { type:"ore", ore, recipeIdx:ri, ratio, catalyst:r.catalyst, machine:r.machine });
      });
    });
  });
  Object.entries(SUB_RECIPES).forEach(([input, recipes]) => {
    recipes.forEach((r, ri) => {
      Object.entries(r.outputs).forEach(([mat, ratio]) => {
        addEntry(mat, { type:"sub", input, recipeIdx:ri, ratio, catalyst:r.catalyst, machine:r.machine });
      });
    });
  });
  return idx;
}

  Attractor:"🧲", "Greater Nat":"🌀", Natorus:"⚗", Fabricula:"🏭",

// Catalyst cost per 10k ore (from Junne's table). Used to show catalyst quantities.
// Values are base per-10k amounts; with OGH Clade (+3%) multiply by 1.03 and ceil.
const CATALYST_PER_10K = {
  "None": 0,
  "Bor": 715,
  "Butter": 500,
  "Calamine": 772,
  "Calx Powder": 715,
  "Coal": 525,
  "Coke": 385,
  "Corn Oil": 500,
  "Dragon Salt": 187,
  "Fuming Salt": 315,
  "Horn Pepper Oil": 422,
  "Ichor": 660,
  "Nitre": 626,
  "Palm Oil": 422,
  "Purified Water": 10000,
  "Rock Oil": 417,
  "Salt": 528,
  "Shimmering Solution": 5000,
  "Sulfur": 560,
  "Sweat Salt": 436,
  "Tallow": 668,
  "Water": 1000,
  "Glimmer Powder": 715,
};

// Extract catalyst name from strings like "Bor (720)" or "Calx Powder (715)"
function parseCatalystName(catalystStr) {
  if (!catalystStr || catalystStr === "None") return "None";
  const m = catalystStr.match(/^(.+?)\s*\(\d+\)$/);
  return m ? m[1].trim() : catalystStr.trim();
}

// Compute total catalyst needed for stacks of ore (with optional OGH 3% buff)
function catalystNeeded(catalystStr, inputUnits, buffKey) {
  const name = parseCatalystName(catalystStr);
  const base = CATALYST_PER_10K[name];
  if (base == null || base === 0) return null;
  const stacks = inputUnits / 10000;
  let qty = stacks * base;
  if (buffKey === "cm" || buffKey === "cmo") qty = Math.ceil(qty * 1.03);
  return { name, qty: Math.ceil(qty), perStack: (buffKey === "cm" || buffKey === "cmo") ? Math.ceil(base * 1.03) : base };
}

// All sub-recipe output materials (non-alloy, non-ore) that can be targeted
// by the best-path logic when someone wants "X units of Skadite"
const EXTRACTION_TARGETS = [...new Set([
  ...Object.values(SUB_RECIPES).flatMap(rs => rs.flatMap(r => Object.keys(r.outputs))),
])].sort();

// Everything you can target: alloys + extraction targets
const ALL_TARGETS = [
  ...Object.keys(REFINING_RECIPES),
  ...EXTRACTION_TARGETS.filter(t => !REFINING_RECIPES[t]),
].sort();

// ── Path computation helpers ──────────────────────────────────────────────────

function buildForwardGraph(allowDangerous, allowKimurite) {
  const graph = {};
  const addEdge = (from, to, meta) => {
    if (!allowDangerous && DANGEROUS_MACHINES.has(meta.machine)) return;
    if (!allowKimurite && from === "Kimurite") return;
    if (RARE_CATALYSTS.has(parseCatalystName(meta.catalyst))) return;
    if (!graph[from]) graph[from] = [];
    graph[from].push({ to, ...meta });
  };
  Object.entries(RECIPES).forEach(([ore, recipes]) => {
    recipes.forEach((r, ri) => {
      Object.entries(r.outputs).forEach(([mat, ratio]) => {
        addEdge(ore, mat, { ratio, machine:r.machine, catalyst:r.catalyst, recipeIdx:ri });
      });
    });
  });
  Object.entries(SUB_RECIPES).forEach(([input, recipes]) => {
    recipes.forEach((r, ri) => {
      Object.entries(r.outputs).forEach(([mat, ratio]) => {
        addEdge(input, mat, { ratio, machine:r.machine, catalyst:r.catalyst, recipeIdx:ri });
      });
    });
  });
  return graph;
}

function findAllPaths(start, target, graph, maxDepth=8) {
  const paths = [];
  function dfs(node, path, visited) {
    if (path.length > maxDepth) return;
    if (node === target) { paths.push([...path]); return; }
    (graph[node] || []).forEach(edge => {
      if (!visited.has(edge.to)) {
        visited.add(edge.to);
        path.push(edge);
        dfs(edge.to, path, visited);
        path.pop();
        visited.delete(edge.to);
      }
    });
  }
  dfs(start, [], new Set([start]));
  return paths;
}

function pathYield(path, startQty, mult) {
  let qty = startQty;
  path.forEach(e => { qty = qty * (e.ratio / 10000) * mult; });
  return qty;
}

function getPathByproducts(path, startQty, mult) {
  const byproducts = {};
  let runningQty = startQty;
  path.forEach(edge => {
    const mainQty = runningQty * (edge.ratio / 10000) * mult;
    // find all outputs of this edge's recipe
    const allOutputs = (() => {
      for (const [, recs] of Object.entries(RECIPES))
        for (const r of recs)
          if (r.machine===edge.machine && r.catalyst===edge.catalyst && r.outputs[edge.to]===edge.ratio)
            return Object.entries(r.outputs);
      for (const [, recs] of Object.entries(SUB_RECIPES))
        for (const r of recs)
          if (r.machine===edge.machine && r.catalyst===edge.catalyst && r.outputs[edge.to]===edge.ratio)
            return Object.entries(r.outputs);
      return [];
    })();
    allOutputs.forEach(([prod, prodRatio]) => {
      if (prod === edge.to) return;
      byproducts[prod] = (byproducts[prod]||0) + runningQty*(prodRatio/10000)*mult;
    });
    runningQty = mainQty;
  });
  return byproducts;
}

// Score paths: index 0 = most target, index 1 = best byproduct value, rest sorted by yield
function scorePaths(rawPaths, startQty, target, mult) {
  return rawPaths.map((p, i) => ({
    path: p,
    yield: pathYield(p, startQty, mult),
    byproducts: getPathByproducts(p, startQty, mult),
    idx: i,
  })).sort((a, b) => b.yield - a.yield);
}

// ── Reverse-search logic (for alloys) ────────────────────────────────────────

function computeIngredients(alloy, amount, buffKey) {
  const recipe = REFINING_RECIPES[alloy];
  if (!recipe) return null;
  const totalParts = recipe.ingredients.reduce((s,[,p])=>s+p, 0);
  const furnaceYield = (buffKey === "cm" || buffKey === "cmo") ? 0.3605 : 0.35;
  const totalInput = amount / furnaceYield;
  return recipe.ingredients.map(([name,parts])=>({ name, needed: totalInput*(parts/totalParts) }));
}

function bestSourceFor(material, allowDangerous, allowKimurite) {
  const index = buildExtractionIndex(allowDangerous, allowKimurite);
  const sources = index[material];
  if (!sources || sources.length===0) return null;
  return sources.reduce((best,s)=>s.ratio>best.ratio?s:best, sources[0]);
}

function computeReverseResult(alloy, qty, allowDangerous, allowKimurite, mult, buffKey, ownedMaterials = new Set()) {
  // expand refining tree
  const refiningSteps = [];
  const visitedRef = new Set();
  function expandRefining(alloyName, neededQty) {
    if (visitedRef.has(alloyName)) return;
    visitedRef.add(alloyName);
    const recipe = REFINING_RECIPES[alloyName];
    if (!recipe) return;
    const ings = computeIngredients(alloyName, neededQty, buffKey);
    ings.forEach(({ name, needed }) => {
      // Only recurse into sub-alloys that the player doesn't already own
      if (REFINING_RECIPES[name] && !ownedMaterials.has(name)) expandRefining(name, needed);
    });
    refiningSteps.push({ output: alloyName, outputQty: neededQty, ingredients: ings });
  }
  expandRefining(alloy, qty);
  // Remove refining steps for alloys the player already owns
  const filteredRefiningSteps = refiningSteps.filter(s => !ownedMaterials.has(s.output));

  const rawNeeds = {}, vendorNeeds = {}, collectedNeeds = {};
  refiningSteps.forEach(step => {
    step.ingredients.forEach(({ name, needed }) => {
      if (ownedMaterials.has(name)) {
        // Player already has this alloy — collect from dungeon/loot, skip its extraction chain
        collectedNeeds[name] = (collectedNeeds[name]||0) + needed;
      } else if (!REFINING_RECIPES[name]) {
        if (VENDOR_MATERIALS.has(name) || SPECIAL_MATERIAL_LABEL[name]) vendorNeeds[name] = (vendorNeeds[name]||0)+needed;
        else rawNeeds[name] = (rawNeeds[name]||0)+needed;
      }
      // if REFINING_RECIPES[name] and NOT owned, its ingredients were already expanded recursively
    });
  });

  const miningMap = {};
  const extractionStepList = [];
  const addedExtrSteps = new Set();

  // Catalysts that must be mined/extracted (not pure vendor items)
  const EXTRACTABLE_CATALYSTS = new Set([
    "Calx Powder", "Coal", "Coke", "Sulfur", "Ichor",
    "Salt", "Water", "Calamine", "Malachite"
  ]);

  // Bor is also treated as "special collect" — not mined, not extracted
  const SPECIAL_COLLECT = new Set(["Bor"]);

  function resolveExtraction(material, needed) {
    const src = bestSourceFor(material, allowDangerous, allowKimurite);
    if (!src) return;
    const oreName = src.type==="ore" ? src.ore : src.input;
    const yieldPer = (src.ratio/10000)*mult;
    const inputNeeded = needed/yieldPer;
    const stepKey = `${oreName}->${material}`;
    if (!addedExtrSteps.has(stepKey)) {
      addedExtrSteps.add(stepKey);
      extractionStepList.push({ from:oreName, to:material, needed, inputNeeded, machine:src.machine, catalyst:src.catalyst, ratio:src.ratio });
    } else {
      const ex = extractionStepList.find(s=>s.from===oreName&&s.to===material);
      if (ex) { ex.needed+=needed; ex.inputNeeded+=inputNeeded; }
    }
    if (src.type==="sub" && !RECIPES[src.input]) resolveExtraction(oreName, inputNeeded);
    else {
      if (!miningMap[oreName]) miningMap[oreName]={ oreNeeded:0 };
      miningMap[oreName].oreNeeded+=inputNeeded;
    }
  }

  // Pass 1: resolve all primary material needs
  Object.entries(rawNeeds).forEach(([mat,needed])=>resolveExtraction(mat,needed));

  // Pass 2: collect catalyst needs from all primary extraction steps (once, no recursion)
  const catalystNeededMap = {}; // catalystName -> totalQty
  extractionStepList.forEach(s => {
    const catName = parseCatalystName(s.catalyst);
    if (!catName || catName === "None") return;
    // Special materials (vendor/collect) go to vendorNeeds, not catalystNeededMap
    if (VENDOR_MATERIALS.has(catName) || SPECIAL_MATERIAL_LABEL[catName]) {
      const cat = catalystNeeded(s.catalyst, s.inputNeeded, buffKey);
      if (cat && cat.qty > 0) vendorNeeds[catName] = (vendorNeeds[catName]||0) + cat.qty;
      return;
    }
    if (!EXTRACTABLE_CATALYSTS.has(catName)) return;
    const cat = catalystNeeded(s.catalyst, s.inputNeeded, buffKey);
    if (cat && cat.qty > 0) catalystNeededMap[catName] = (catalystNeededMap[catName]||0) + cat.qty;
  });

  // Pass 3: resolve catalyst extraction chains separately
  const catalystExtrSteps = [];
  const catMiningMap = {};
  const addedCatSteps = new Set();

  function resolveCatalystExtr(material, needed) {
    const src = bestSourceFor(material, allowDangerous, allowKimurite);
    if (!src) return;
    const oreName = src.type==="ore" ? src.ore : src.input;
    const yieldPer = (src.ratio/10000)*mult;
    const inputNeeded = needed/yieldPer;
    const stepKey = `cat:${oreName}->${material}`;
    if (!addedCatSteps.has(stepKey)) {
      addedCatSteps.add(stepKey);
      catalystExtrSteps.push({ from:oreName, to:material, needed, inputNeeded, machine:src.machine, catalyst:src.catalyst, ratio:src.ratio, isCatalystStep:true });
    } else {
      const ex = catalystExtrSteps.find(s=>s.from===oreName&&s.to===material);
      if (ex) { ex.needed+=needed; ex.inputNeeded+=inputNeeded; }
    }
    if (src.type==="sub" && !RECIPES[src.input]) resolveCatalystExtr(oreName, inputNeeded);
    else {
      if (!catMiningMap[oreName]) catMiningMap[oreName]={ oreNeeded:0 };
      catMiningMap[oreName].oreNeeded+=inputNeeded;
    }
    // Handle catalysts-of-catalysts (e.g. Coal needed to make Coke)
    const subCatName = parseCatalystName(src.catalyst);
    if (subCatName && subCatName !== "None" && EXTRACTABLE_CATALYSTS.has(subCatName)) {
      const subCat = catalystNeeded(src.catalyst, inputNeeded, buffKey);
      if (subCat && subCat.qty > 0) {
        const subKey = `subcat:${stepKey}:${subCatName}`;
        if (!addedCatSteps.has(subKey)) {
          addedCatSteps.add(subKey);
          resolveCatalystExtr(subCatName, subCat.qty);
        }
      }
    }
  }

  Object.entries(catalystNeededMap).forEach(([mat,needed])=>resolveCatalystExtr(mat,needed));

  // Reverse to get correct dependency order (deepest dependencies first)
  catalystExtrSteps.reverse();

  // Add vendor/special catalyst items directly into catalystExtrSteps
  // so they appear in the same phase with their vendor note
  Object.entries(vendorNeeds).forEach(([mat, needed]) => {
    const label = SPECIAL_MATERIAL_LABEL[mat] || "Buy from vendor";
    catalystExtrSteps.push({ from:null, to:mat, needed, inputNeeded:0, machine:null, catalyst:null, ratio:0, isCatalystStep:true, isVendor:true, vendorLabel:label });
  });
  // Clear vendorNeeds so it doesn't render as a separate section
  Object.keys(vendorNeeds).forEach(k => delete vendorNeeds[k]);

  // Merge catalyst mining into main mining map
  Object.entries(catMiningMap).forEach(([ore,info])=>{
    if (!miningMap[ore]) miningMap[ore]={ oreNeeded:0 };
    miningMap[ore].oreNeeded+=info.oreNeeded;
  });
  Object.values(miningMap).forEach(o=>{ o.stacks=o.oreNeeded/10000; });
  const sortedMining = Object.entries(miningMap).sort((a,b)=>b[1].oreNeeded-a[1].oreNeeded);

  const stepsByFrom = {};
  extractionStepList.forEach(s=>{ if(!stepsByFrom[s.from]) stepsByFrom[s.from]=[]; stepsByFrom[s.from].push(s); });
  const orderedExtr = [];
  const addedToOrdered = new Set();
  function followChain(fromNode) {
    (stepsByFrom[fromNode]||[]).forEach(s => {
      const key=`${s.from}->${s.to}`;
      if (addedToOrdered.has(key)) return;
      addedToOrdered.add(key);
      orderedExtr.push(s);
      followChain(s.to);
    });
  }
  sortedMining.forEach(([oreName])=>followChain(oreName));

  const hiddenWarnings = [];
  if (!allowDangerous) {
    Object.entries(rawNeeds).forEach(([mat])=>{
      const safeSrc=bestSourceFor(mat,false,allowKimurite);
      if (safeSrc) return;
      const dangSrc=bestSourceFor(mat,true,allowKimurite);
      if (!dangSrc) return;
      hiddenWarnings.push({ material:mat, dangOre:dangSrc.type==="ore"?dangSrc.ore:dangSrc.input, dangMachine:dangSrc.machine, dangRatio:dangSrc.ratio });
    });
  }

  return { sortedMining, orderedExtr, catalystExtrSteps, refiningSteps: filteredRefiningSteps, hiddenWarnings, vendorNeeds, collectedNeeds };
}

    // Collected (owned by player — dungeon/loot)
    collectedNeeds && Object.keys(collectedNeeds).length > 0 && React.createElement(CollapsibleSection,{
      title:"🎒 Collected Materials", color:"#c9a227", count:Object.keys(collectedNeeds).length
    },
      Object.entries(collectedNeeds).map(([mat,needed])=>
        React.createElement('div',{key:mat,style:{
          display:"flex",justifyContent:"space-between",alignItems:"center",
          background:"var(--bg2)",border:"0.5px solid var(--border)",
          borderRadius:"var(--r-md)",padding:"10px 14px",marginBottom:6,
          borderLeft:"3px solid #c9a227"
        }},
          React.createElement('div',null,
            React.createElement('span',{style:{fontSize:13,fontWeight:600,color:"var(--text1)"}},`🎒 ${mat}`),
            React.createElement('span',{style:{fontSize:11,color:"var(--text3)",marginLeft:8}},"from dungeons / loot")
          ),
          React.createElement('span',{className:'badge badge-gold'},fmt(needed)+" units")
        )
      )
    ),

    // Special Materials (vendor / collect)
    vendorNeeds && Object.keys(vendorNeeds).length > 0 && React.createElement(CollapsibleSection,{
      title:"🛒 Special Materials", color:"var(--purple)", count:Object.keys(vendorNeeds).length
    },
      (() => {
        const groups = {};
        Object.entries(vendorNeeds).forEach(([mat, needed]) => {
          const label = SPECIAL_MATERIAL_LABEL[mat] || "Buy from vendor";
          if (!groups[label]) groups[label] = [];
          groups[label].push([mat, needed]);
        });
        const icons = { "Buy from utility vendor":"🛒", "Buy from magic vendor":"✨", "Collect outside of Meduli":"🌍" };
        return Object.entries(groups).map(([label, items]) =>
          React.createElement('div',{key:label,style:{marginBottom:10}},
            React.createElement('div',{style:{fontSize:10,color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:5,fontWeight:600}},
              `${icons[label]||"🛒"} ${label}`),
            items.map(([mat, needed]) =>
              React.createElement('div',{key:mat,style:{
                display:"flex",justifyContent:"space-between",alignItems:"center",
                background:"var(--bg2)",border:"0.5px solid var(--border)",
                borderRadius:"var(--r-md)",padding:"8px 14px",marginBottom:4,
                borderLeft:"3px solid var(--purple)"
              }},
                React.createElement('span',{style:{fontSize:13,fontWeight:600,color:"var(--text1)"}}, mat),
                React.createElement('span',{className:'badge badge-purple'}, fmt(needed)+" units")
              )
            )
          )
        );
      })()
    ),

    // Phase 2 Extraction
    // ── Catalyst preparation phase (new) ─────────────────────────────
    catalystExtrSteps && catalystExtrSteps.length > 0 && React.createElement(CollapsibleSection,{
      title:"🧪 Phase 2 — Catalyst Prep", color:"#c9a227", count:catalystExtrSteps.length
    },
      catalystExtrSteps.map((s,i) => {
        const color = STEP_COLORS[Math.min(i,3)];

        // Vendor item — render as a simple purchase card
        if (s.isVendor) {
          const icons = { "Buy from utility vendor":"🛒", "Buy from magic vendor":"✨", "Collect outside of Meduli":"🌍" };
          const icon = icons[s.vendorLabel] || "🛒";
          return React.createElement('div',{key:`vendor-${s.to}`,style:{
            display:"flex",justifyContent:"space-between",alignItems:"center",
            background:"var(--bg1)",border:"0.5px solid var(--border)",
            borderRadius:"var(--r-md)",padding:"10px 14px",marginBottom:8,
            borderLeft:"3px solid var(--purple)"
          }},
            React.createElement('div',null,
              React.createElement('div',{style:{fontSize:13,fontWeight:600,color:"var(--text1)"}}, s.to),
              React.createElement('div',{style:{fontSize:11,color:"var(--text3)",marginTop:2}}, `${icon} ${s.vendorLabel}`)
            ),
            React.createElement('span',{className:'badge badge-purple'}, fmt(s.needed)+" units")
          );
        }

        // Normal extraction step
        return React.createElement(StepCard,{key:`cat-${s.from}->${s.to}`, color,
          title:`${s.from} → ${s.to}`,
          badge:fmt(s.needed)+" "+s.to, badgeClass:"badge-gold"},
          React.createElement('div',{style:{fontSize:11,color:"var(--text3)"}},
            (()=>{
              const cat2 = catalystNeeded(s.catalyst, s.inputNeeded, buffKey);
              const catStr2 = cat2 && cat2.qty > 0
                ? `${cat2.name}: ${fmt(cat2.qty)} total (${cat2.perStack}/stack)`
                : `Catalyst: ${s.catalyst}`;
              return `${MACHINE_ICONS[s.machine]||"⚙"} ${s.machine} · ${catStr2} · Yield: ${(s.ratio/100).toFixed(2)}%`
                +(buffKey!=="none"?` (×${BUFF_MULTIPLIERS[buffKey]} buffed)`:"");
            })()
          ),
          React.createElement('div',{style:{fontSize:11,color:"var(--text2)",marginTop:4}},`Input: ${fmt(s.inputNeeded)} ${s.from}`)
        );
      })
    ),

    // ── Main extraction phase (renumbered to Phase 3) ─────────────────
    orderedExtr.length > 0 && React.createElement(CollapsibleSection,{
      title:`⚙ Phase ${catalystExtrSteps && catalystExtrSteps.length > 0 ? 3 : 2} — Extraction`, color:"var(--green)", count:orderedExtr.length
    },
      (() => {
        const elements = [];
        let currentRootOre = null, colorIdx = 0;
        orderedExtr.forEach((s,i) => {
          const isRootStep = !!RECIPES[s.from];
          if (isRootStep && s.from !== currentRootOre) {
            currentRootOre = s.from;
            colorIdx = i;
            if (i>0) elements.push(React.createElement('div',{key:'gap-'+s.from,style:{height:4}}));
          }
          const color = STEP_COLORS[Math.min(colorIdx,3)];
          const catName = parseCatalystName(s.catalyst);
          const isPractical = isStepPractical(s.from, s.to, s.catalyst, allowDangerous);
          const catStr = (() => {
            const cat = catalystNeeded(s.catalyst, s.inputNeeded, buffKey);
            if (cat && cat.qty > 0) {
              return `${cat.name}: ${fmt(cat.qty)} total (${cat.perStack}/stack)`;
            }
            const stacks = s.inputNeeded/10000;
            const m = s.catalyst.match(/^(.+?)\s*\((\d+)\)$/);
            return m ? `${m[1]}: ${fmt(stacks*Number(m[2]))} (${m[2]}/stack)` : `Catalyst: ${s.catalyst}`;
          })();
          elements.push(React.createElement(StepCard,{key:s.from+"->"+s.to, color,
            title:`${s.from} → ${s.to}`,
            badge:fmt(s.needed)+" "+s.to, badgeClass:"badge-green"},
            React.createElement('div',{style:{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}},
              React.createElement('span',{style:{fontSize:11,color:"var(--text3)"}},
                `${MACHINE_ICONS[s.machine]||"⚙"} ${s.machine} · ${catStr} · Yield: ${(s.ratio/100).toFixed(2)}%`
                +(buffKey!=="none"?` (×${BUFF_MULTIPLIERS[buffKey]} buffed)`:"")),
              isPractical && React.createElement('span',{style:{
                fontSize:10,padding:"1px 7px",borderRadius:10,
                background:"#1a2e1f",border:"0.5px solid var(--green)",
                color:"var(--green)",fontWeight:600,whiteSpace:"nowrap"
              }},"✓ practical option")
            ),
            React.createElement('div',{style:{fontSize:11,color:"var(--text2)",marginTop:4}},
              `Input: ${fmt(s.inputNeeded)} ${s.from}`)
          ));
        });
        return elements;
      })()
    ),

    // Phase 3/4 Refining
    refiningSteps && refiningSteps.length > 0 && React.createElement(CollapsibleSection,{
      title:`🔥 Phase ${catalystExtrSteps && catalystExtrSteps.length > 0 ? 4 : 3} — Refining`, color:"var(--blue)", count:refiningSteps.length
    },
      refiningSteps.map((step,i)=>
        React.createElement(StepCard,{key:step.output, color:STEP_COLORS[Math.min(i,3)],
          label:"Step "+(i+1), title:`Refine → ${step.output}`,
          badge:fmt(step.outputQty)+" "+step.output, badgeClass:"badge-green"},
          React.createElement('div',{style:{fontSize:11,color:"var(--text3)",marginBottom:6}},
            "Furnace (35% yield): "+step.ingredients.map(ing=>`${fmt(ing.needed)} ${ing.name}`).join(" + ")),
          step.ingredients.map(ing=>
            React.createElement('div',{key:ing.name,style:{display:"flex",justifyContent:"space-between",fontSize:12,padding:"2px 0",borderBottom:"0.5px solid var(--border)"}},
              React.createElement('span',{style:{color:"var(--text2)"}},ing.name),
              React.createElement('span',{className:'badge badge-blue'},fmt(ing.needed))
            )
          )
        )
      )
    )
  );
}

// ── Hero: shows final target amount + byproducts ──────────────────────────────
function ResultHero({ target, targetQty, byproducts }) {
  const bpEntries = Object.entries(byproducts||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  return React.createElement('div', { className:"ref-hero" },
    React.createElement('div', null,
      React.createElement('div', { className:"ref-hero-label" }, "Target output"),
      React.createElement('div', { style:{display:"flex",alignItems:"baseline",gap:8} },
        React.createElement('div', { className:"ref-hero-main" }, fmt(targetQty)),
        React.createElement('div', { style:{fontSize:14,color:"var(--text2)",fontWeight:600} }, target)
      ),
      bpEntries.length > 0 && React.createElement('div', { className:"ref-hero-byproducts" },
        bpEntries.map(([name,qty])=>
          React.createElement('div',{key:name,className:"ref-hero-bp-chip"},
            React.createElement('span',null,name),
            React.createElement('span',{className:"bp-val"},fmt(qty))
          )
        )
      )
    )
  );
}

// ── Main merged tab ───────────────────────────────────────────────────────────
function RefiningExtractionTab({ buffKey }) {
  const mult = BUFF_MULTIPLIERS[buffKey];
  const allowDangerous  = useContext(DangerContext);
  const allowKimurite   = useContext(KimuriteContext);

  const [target,    setTarget]    = useState("Steel");
  const [amount,    setAmount]    = useState("");
  const [result,    setResult]    = useState(null);
  const [pathIdx,   setPathIdx]   = useState(0);
  const [oreFilter, setOreFilter] = useState(null); // null = show all ores
  const [ownedMaterials, setOwnedMaterials] = useState([]); // materials player already has (array for React dep tracking)

  // Auto-recalculate when filters or buff change, but only if a result already exists
  useEffect(() => {
    if (!result) return;
    const qty = parseFloat(amount.replace(/,/g,""));
    if (!qty || qty <= 0) return;
    calculate();
  }, [allowDangerous, allowKimurite, buffKey, ownedMaterials]);

  // ALL possible targets: alloys first, then pure extraction targets
  const alloyTargets = Object.keys(REFINING_RECIPES);
  const purePaths    = EXTRACTION_TARGETS.filter(t => !REFINING_RECIPES[t]);
  const allTargets   = [...alloyTargets, ...purePaths];

  const isAlloy = !!REFINING_RECIPES[target];

  function calculate() {
    const qty = parseFloat(amount.replace(/,/g,""));
    if (!qty || qty <= 0) return;

    if (isAlloy) {
      // Alloy mode: single deterministic guide from reverse-search
      const guide = computeReverseResult(target, qty, allowDangerous, allowKimurite, mult, buffKey, new Set(ownedMaterials));
      // Byproducts = everything produced during extraction that isn't an alloy ingredient
      // (just collect from extraction steps)
      const bp = {};
      guide.orderedExtr.forEach(s => {
        // for each extraction step, get all outputs of that recipe
        const allOutputs = (() => {
          for (const [,recs] of Object.entries(RECIPES))
            for (const r of recs)
              if (r.machine===s.machine && r.catalyst===s.catalyst && r.outputs[s.to] && r.outputs[s.to]>0)
                return Object.entries(r.outputs);
          for (const [,recs] of Object.entries(SUB_RECIPES))
            for (const r of recs)
              if (r.machine===s.machine && r.catalyst===s.catalyst && r.outputs[s.to] && r.outputs[s.to]>0)
                return Object.entries(r.outputs);
          return [];
        })();
        allOutputs.forEach(([prod,ratio]) => {
          if (prod === s.to) return;
          bp[prod] = (bp[prod]||0) + s.inputNeeded*(ratio/10000)*mult;
        });
      });
      setResult({ mode:"alloy", target, qty, guide, byproducts:bp });
      setPathIdx(0);
    } else {
      // Extraction path mode: find all paths from every starting ore to target
      const graph = buildForwardGraph(allowDangerous, allowKimurite);
      let allPaths = [];
      Object.keys(RECIPES).forEach(ore => {
        const ps = findAllPaths(ore, target, graph);
        ps.forEach(p => allPaths.push({ ore, path:p }));
      });
      if (VENDOR_MATERIALS.has(target)) { setResult({ mode:"vendor", target, qty }); return; }
      if (allPaths.length === 0) { setResult({ mode:"nopaths", target, qty }); return; }

      // Score: for each path compute yield FROM qty of ore
      // But we want "I want QTY of target", so we need to find how much ore gives that yield
      // Actually best-path gives paths from ore amount, let's compute reverse:
      // We can't do reverse easily, so instead we find paths from each ore to target
      // and score by final yield given 10k ore, then scale to show what qty of ore gives qty of target
      const scored = allPaths.map(({ ore, path }) => {
        // ratio of 10k ore to target
        const yieldPer10k = pathYield(path, 10000, mult);
        // to get qty target you need: oreNeeded = qty / (yieldPer10k / 10000)
        const oreNeeded = qty / (yieldPer10k / 10000);
        const byproducts = getPathByproducts(path, oreNeeded, mult);
        return { ore, path, targetQty:qty, oreNeeded, byproducts, yieldPer10k };
      }).sort((a,b) => {
        const oreDiff = a.oreNeeded - b.oreNeeded;
        if (Math.abs(oreDiff) > 0.01) return oreDiff; // different ore amounts — sort normally
        // Tiebreak: practical catalyst (Rock Oil / Coke) wins
        const aPractical = a.path.some(e => { const c = parseCatalystName(e.catalyst); return c==="Rock Oil"||c==="Coke"; });
        const bPractical = b.path.some(e => { const c = parseCatalystName(e.catalyst); return c==="Rock Oil"||c==="Coke"; });
        if (aPractical && !bPractical) return -1;
        if (!aPractical && bPractical) return 1;
        return 0;
      }); // sort: least ore needed = most efficient, practical wins tiebreaks

      setResult({ mode:"extraction", target, qty, scored });
      setPathIdx(0);
    }
  }

  // ── Render ────────────────────────────────────────────────────────────────
  const noResult = !result;

  return React.createElement('div', null,
    // Input card
    React.createElement('div', { className:"rs-card" },
      React.createElement('div', { style:{marginBottom:12,fontSize:13,color:"var(--text2)"} },
        "Enter your target material and quantity for a step-by-step production guide — from raw ore to finished product."),
      React.createElement('div', { className:"rs-row" },
        React.createElement('div', { className:"rs-field", style:{flex:2} },
          React.createElement('span', { className:"rs-label" }, "Target Material"),
          React.createElement('select', { value:target, onChange:e=>{ setTarget(e.target.value); setResult(null); setOreFilter(null); setPathIdx(0); setOwnedMaterials([]); } },
            React.createElement('optgroup', { label:"Alloys" },
              alloyTargets.map(a=>React.createElement('option',{key:a,value:a},a))
            ),
            React.createElement('optgroup', { label:"Extraction Materials" },
              purePaths.map(t=>React.createElement('option',{key:t,value:t},t))
            )
          )
        ),
        React.createElement('div', { className:"rs-field", style:{flex:2} },
          React.createElement('span', { className:"rs-label" }, "Desired Amount"),
          React.createElement('div',{style:{display:"flex",gap:6,alignItems:"center"}},
            React.createElement('input', { type:"text", placeholder:"e.g. 10000", value:amount,
              onChange:e=>setAmount(e.target.value), onKeyDown:e=>e.key==="Enter"&&calculate() })
          )
        ),
        React.createElement('button', { className:"rs-btn", onClick:calculate }, "Calculate")
      ),

      // ── Owned materials toggles (skip extraction for these) ────────────
      (() => {
        // Find all refining alloys that are direct ingredients in this target's recipe chain
        // e.g. for Steel: Grain Steel is a sub-alloy ingredient
        // Only Grain Steel can be directly collected from dungeons
        const DUNGEON_COLLECTABLES = new Set(["Grain Steel"]);
        const ownableIngredients = [];
        const visited = new Set();
        function findOwnableIngs(alloyName) {
          if (visited.has(alloyName)) return;
          visited.add(alloyName);
          const recipe = REFINING_RECIPES[alloyName];
          if (!recipe) return;
          recipe.ingredients.forEach(([name]) => {
            if (REFINING_RECIPES[name] && DUNGEON_COLLECTABLES.has(name)) {
              if (!ownableIngredients.includes(name)) ownableIngredients.push(name);
            }
            if (REFINING_RECIPES[name]) findOwnableIngs(name);
          });
        }
        if (REFINING_RECIPES[target]) findOwnableIngs(target);
        if (ownableIngredients.length === 0) return null;
        return React.createElement('div',{style:{marginTop:10,paddingTop:10,borderTop:"0.5px solid var(--border)"}},
          React.createElement('div',{style:{fontSize:11,color:"var(--text3)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.06em"}},"Start from Grain Steel?"),
          React.createElement('div',{style:{display:"flex",gap:6,flexWrap:"wrap"}},
            ownableIngredients.map(mat => {
              const owned = ownedMaterials.includes(mat);
              return React.createElement('button',{
                key:mat,
                onClick:()=>setOwnedMaterials(prev=>
                  owned ? prev.filter(m=>m!==mat) : [...prev, mat]
                ),
                style:{
                  padding:"5px 12px",borderRadius:20,fontSize:12,fontWeight:500,cursor:"pointer",
                  border:`1px solid ${owned?"#c9a227":"var(--border)"}`,
                  background: owned ? "#2a2010" : "var(--bg2)",
                  color: owned ? "#c9a227" : "var(--text3)",
                }
              }, owned ? `✓ Have ${mat}` : `+ Have ${mat}`)
            })
          )
        );
      })()
    ),

    // No paths
    result && result.mode === "nopaths" && React.createElement('div', {
      className: "danger-warning", style:{marginTop:12}
    },
      React.createElement('div', { className:"danger-warning-title" },
        "⚠ INCOMPLETE: Greater Nat / Blast Furnace filter must be turned ON"
      ),
      React.createElement('div', { style:{fontSize:12,color:"#c8a07a"} },
        `No safe extraction path exists for `,
        React.createElement('span',{className:"danger-warning-highlight"}, result.target),
        `. This material can only be produced using Greater Nat or Blast Furnace. Enable the toggle above and recalculate.`
      )
    ),

    // Vendor material — just buy it
    result && result.mode === "vendor" && React.createElement('div', {
      style:{ background:"var(--bg1)", border:"1px solid var(--gold)",
              borderRadius:"var(--r-lg)", padding:"20px 24px", marginTop:12,
              textAlign:"center" }
    },
      React.createElement('div', { style:{fontSize:48, marginBottom:8} }, "🤡"),
      React.createElement('div', { style:{fontSize:18, fontWeight:700, color:"var(--gold)", marginBottom:6} },
        "lmao just buy it off vendor"),
      React.createElement('div', { style:{fontSize:13, color:"var(--text2)"} },
        `${result.target} is dirt cheap from vendors — extracting it yourself is not worth your time.`)
    ),

    // Alloy result
    result && result.mode === "alloy" && React.createElement('div', null,
      React.createElement(ResultHero, { target:result.target, targetQty:result.qty, byproducts:result.byproducts }),
      React.createElement(GuideContent, { ...result.guide, buffKey, collectedNeeds: result.guide.collectedNeeds||{}, catalystExtrSteps: result.guide.catalystExtrSteps||[] })
    ),

    // Extraction path result
    result && result.mode === "extraction" && React.createElement('div', null,
      // Hero for selected path
      React.createElement(ResultHero, {
        target: result.target,
        targetQty: result.qty,
        byproducts: result.scored[pathIdx].byproducts,
      }),

      // Path selector pills
      result.scored.length > 1 && React.createElement('div', null,
        // Header row: count + ore filter buttons
        React.createElement('div', { style:{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:8} },
          React.createElement('span', { style:{fontSize:11,color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.07em"} },
            `${result.scored.length} routes found`),
          React.createElement('span', { style:{fontSize:11,color:"var(--text3)",margin:"0 4px"} }, "·"),
          React.createElement('span', { style:{fontSize:11,color:"var(--text3)"} }, "Filter by ore:"),
          // "All" pill
          React.createElement('button', {
            style:{ padding:"2px 10px", borderRadius:20, border:"1px solid var(--border)",
                    background: oreFilter===null?"var(--info-bg)":"var(--bg2)",
                    color: oreFilter===null?"var(--blue)":"var(--text2)",
                    fontSize:11, cursor:"pointer", fontWeight: oreFilter===null?600:400 },
            onClick: () => { setOreFilter(null); setPathIdx(0); }
          }, "All"),
          // One pill per unique ore
          [...new Set(result.scored.map(p=>p.ore))].map(ore =>
            React.createElement('button', {
              key: ore,
              style:{ padding:"2px 10px", borderRadius:20, border:"1px solid var(--border)",
                      background: oreFilter===ore?"#0d1a10":"var(--bg2)",
                      color: oreFilter===ore?"var(--green)":"var(--text2)",
                      fontSize:11, cursor:"pointer", fontWeight: oreFilter===ore?600:400,
                      borderColor: oreFilter===ore?"var(--green)":"var(--border)" },
              onClick: () => { setOreFilter(ore); setPathIdx(0); }
            }, `From ${ore}`)
          )
        ),
        // Route pills — filtered
        React.createElement('div', { className:"path-tabs" },
          (() => {
            const filtered = oreFilter
              ? result.scored.filter(p => p.ore === oreFilter)
              : result.scored;
            return filtered.slice(0,5).map((p, i) => {
              const globalIdx = result.scored.indexOf(p);
              const bpCount = Object.values(p.byproducts).filter(v=>v>0).length;
              const isOverall = result.scored[0] === p;
              const fromNodes = [p.ore, ...p.path.slice(0,-1).map(e=>e.to)];
              const hasPractical = !isOverall && p.path.some((edge, ei) =>
                isStepPractical(fromNodes[ei], edge.to, edge.catalyst, allowDangerous)
              );
              const label = isOverall
                ? `🏆 Optimal (${p.ore})`
                : hasPractical
                  ? oreFilter ? `✓ Practical` : `✓ Practical (${p.ore})`
                  : oreFilter
                    ? `Route ${i+1}`
                    : `Route ${i+1}: ${p.ore}`;
              return React.createElement('button', {
                key: globalIdx,
                className: `path-tab-btn${isOverall?" best":""}${hasPractical&&!isOverall?" practical":""}${pathIdx===globalIdx?" active":""}`,
                onClick: () => setPathIdx(globalIdx),
              },
                React.createElement('div', null, label),
                React.createElement('div', { style:{fontSize:10,color:"var(--text3)",marginTop:2} },
                  `${fmt(p.oreNeeded)} ore in · ${bpCount} byproducts`)
              );
            });
          })()
        )
      ),

      // Guide for selected path
      (() => {
        const p = result.scored[pathIdx];
        // Build mining + extraction steps for this path
        const oreNeeded = p.oreNeeded;
        const sortedMining = [[p.ore, { oreNeeded, stacks: oreNeeded/10000 }]];
        // Build orderedExtr from path steps
        let runningQty = oreNeeded;
        const orderedExtr = p.path.map(edge => {
          const outQty = runningQty * (edge.ratio/10000) * mult;
          const step = { from: p.ore, to: edge.to, needed: outQty, inputNeeded: runningQty,
                         machine: edge.machine, catalyst: edge.catalyst, ratio: edge.ratio };
          runningQty = outQty;
          return step;
        });
        // Fix from: each step's from is previous step's to
        for (let i=1; i<orderedExtr.length; i++) orderedExtr[i].from = orderedExtr[i-1].to;

        return React.createElement(GuideContent, { sortedMining, orderedExtr, catalystExtrSteps:[], refiningSteps:[], hiddenWarnings:[], vendorNeeds:{}, collectedNeeds:{}, buffKey });
      })()
    )
  );
}

// ══════════════════════════════════════════════════════
//  ROOT APP

function App() {
  const [tab, setTab] = useState("refine");
  const [buffKey, setBuffKey] = useState("none");
  const [allowDangerous, setAllowDangerous] = useState(false);
  const [allowKimurite, setAllowKimurite] = useState(false);
  const mult = BUFF_MULTIPLIERS[buffKey];

  const TABS = [
    { key:"refine", label:"🔥 Refining / Extraction" },
  ];

  return React.createElement(BuffContext.Provider,{value:mult},
    React.createElement(DangerContext.Provider,{value:allowDangerous},
    React.createElement(KimuriteContext.Provider,{value:allowKimurite},
      React.createElement('div',{style:{padding:"1rem 0",maxWidth:720,margin:"0 auto"}},
        React.createElement('h2',{style:{fontSize:18,fontWeight:500,marginBottom:4}},"Mortal Online 2 — Extraction Chain Calculator"),
        React.createElement('p',{style:{fontSize:13,color:"var(--text2)",marginBottom:16}},"Extract, refine, and plan your material chains."),
        React.createElement('div',{className:'tabs'},
          TABS.map(t=>React.createElement('button',{
            key:t.key, className:`tab-btn${tab===t.key?" active":""}`,
            onClick:()=>setTab(t.key)
          },t.label))
        ),
        React.createElement(BuffBar,{buffKey,setBuffKey}),
        React.createElement(DangerBar,{allowDangerous,setAllowDangerous,allowKimurite,setAllowKimurite}),
        tab==="refine" && React.createElement(RefiningExtractionTab,{buffKey}),
      )
    ))
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
