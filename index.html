<!DOCTYPE html>

<style>
  :root {
    --bg0: #0d0f14;
    --bg1: #1a1c22;
    --bg2: #12141a;

    --border: #2e3140;
    --text1: #e8eaf0;
    --text2: #8891a8;
    --text3: #4e5570;

    --info-text: #5ba8f5;
    --green: #1D9E75;
    --blue: #378ADD;
    --purple: #7F77DD;
    --gold: #c9a227;
    --r-lg: 10px;
    --r-md: 6px;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg0); color: var(--text1); min-height: 100vh; padding: 24px 16px; }
  input, select {
    background: var(--bg2); border: 1px solid var(--border);
    color: var(--text1); border-radius: var(--r-md);
    padding: 7px 10px; font-size: 13px; outline: none; width: 100%;
  }
  input:focus, select:focus { border-color: #378ADD66; }
  select option { background: var(--bg1); }
  button { font-family: inherit; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
  .tab-btn {
    padding: 8px 18px; font-size: 13px; font-weight: 500;
    background: none; border: none; cursor: pointer;
    color: var(--text2); border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all 0.15s;
  }
  .tab-btn:hover { color: var(--text1); }
  .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }

  /* Buff bar */
  .buff-toggle {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 13px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--bg2);
    color: var(--text2); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .buff-toggle:hover { border-color: #378ADD55; color: var(--text1); }
  .buff-toggle.active-cm  { background: #1a2e1f; border-color: var(--green); color: var(--green); }
  .buff-toggle.active-cmo { background: #1e2538; border-color: var(--blue);  color: var(--blue);  }
  .buff-toggle .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.7; }
  .buff-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--bg2);
    border: 0.5px solid var(--border); border-radius: var(--r-lg); margin-bottom: 18px;
  }
  .buff-label { font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text3); margin-right: 2px; }
  .buff-active-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; margin-left: auto; }
  .buff-active-badge.cm  { background: #1a2e1f; color: var(--green); }
  .buff-active-badge.cmo { background: #1e2538; color: var(--blue);  }

    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--bg2);
    border: 0.5px solid var(--border); border-radius: var(--r-lg); margin-bottom: 18px;

    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text2); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; white-space: nowrap; user-select: none;
  }
  .danger-toggle:hover { border-color: #e05a3a55; }
  .danger-toggle.on  { background: #2a1a14; border-color: #e05a3a; color: #e05a3a; }
  .danger-toggle.off { background: #1a2e1f; border-color: var(--green); color: var(--green); }

    border-radius: 50%; background: currentColor; opacity: 1;

  }

// Refining recipes from the image (ratio stored as parts: [ingredient, parts])
// 2:1:1 means ingredient1*2 + ingredient2*1 + ingredient3*1 per unit of output
// We store ratios normalised to: to make 1 unit of output you need these ingredients
// Image table: Recipe=output, col2=x2, col1=x1, col1=x1
const REFINING_RECIPES = {
  Bron:          { ingredients: [["Cuprum",2],["Bleck",1],["Saburra Powder",1]] },
  Messing:       { ingredients: [["Cuprum",2],["Calamine",1],["Saburra Powder",1]] },
  "Tind Messing":{ ingredients: [["Messing",2],["Almine",1],["Gem Metal",1]] },
  "Grain Steel": { ingredients: [["Pig Iron",2],["Calx Powder",1],["Coke",1]] },
  Steel:         { ingredients: [["Grain Steel",2],["Coal",1],["Saburra Powder",1]] },
  Tungsteel:     { ingredients: [["Grain Steel",2],["Lupium",1],["Granum Powder",1]] },
  Cronite:       { ingredients: [["Grain Steel",2],["Almine",1],["Acronite",1]] },
  Oghmium:       { ingredients: [["Tungsteel",2],["Cronite",1],["Sanguinite",1]] },
};

// For the reverse search, we need to know which ore + recipe yields each ingredient.
// Build a lookup: material -> list of { ore, recipeIdx, ratio (per 10000 of ore) }
function buildExtractionIndex(allowDangerous) {
  const idx = {};
  const addEntry = (material, source) => {
    if (!allowDangerous && DANGEROUS_MACHINES.has(source.machine)) return;
    if (!idx[material]) idx[material] = [];
    idx[material].push(source);
  };
  Object.entries(RECIPES).forEach(([ore, recipes]) => {
    recipes.forEach((r, ri) => {
      Object.entries(r.outputs).forEach(([mat, ratio]) => {
        addEntry(mat, { type:"ore", ore, recipeIdx:ri, ratio, catalyst:r.catalyst, machine:r.machine });
      });
    });
  });
  Object.entries(SUB_RECIPES).forEach(([input, recipes]) => {
    recipes.forEach((r, ri) => {
      Object.entries(r.outputs).forEach(([mat, ratio]) => {
        addEntry(mat, { type:"sub", input, recipeIdx:ri, ratio, catalyst:r.catalyst, machine:r.machine });
      });
    });
  });
  return idx;
}

// Given a desired alloy and amount, work out how much of each intermediate
// ingredient is needed, then trace back to what raw ores produce those ingredients
// and the best (highest-ratio) recipe for each.

function computeIngredients(alloy, amount) {
  // Furnace yield = 35% of total input.
  // So: total_input = desired_output / 0.35
  // Each ingredient = total_input * (parts / sum_of_parts)
  const recipe = REFINING_RECIPES[alloy];
  if (!recipe) return null;
  const totalParts = recipe.ingredients.reduce((s,[,p])=>s+p, 0);
  const totalInput = amount / 0.35;
  return recipe.ingredients.map(([name,parts])=>({ name, needed: totalInput * (parts / totalParts) }));
}

// Find the best ore+recipe that yields a given material (highest ratio)
function bestSourceFor(material, allowDangerous) {
  const index = buildExtractionIndex(allowDangerous);
  const sources = index[material];
  if (!sources || sources.length===0) return null;
  return sources.reduce((best,s)=>s.ratio>best.ratio?s:best, sources[0]);
}

function ReverseSearchTab({ buffKey }) {
  const mult = BUFF_MULTIPLIERS[buffKey];
  const allowDangerous = useContext(DangerContext);
  const alloys = Object.keys(REFINING_RECIPES);
  const [alloy, setAlloy] = useState("Steel");
  const [amount, setAmount] = useState("");
  const [result, setResult] = useState(null);


  function calculate() {
    const qty = parseFloat(amount.replace(/,/g,""));
    if (!qty || qty<=0) return;

    // ── Phase A: Expand refining tree bottom-up ─────────────────────────
    // Each entry: { output, outputQty, ingredients:[{name,needed}] }
    const refiningSteps = [];
    const visitedRef = new Set();
    function expandRefining(alloyName, neededQty) {
      if (visitedRef.has(alloyName)) return;
      visitedRef.add(alloyName);
      const recipe = REFINING_RECIPES[alloyName];
      if (!recipe) return;
      const ings = computeIngredients(alloyName, neededQty);
      ings.forEach(({ name, needed }) => {
        if (REFINING_RECIPES[name]) expandRefining(name, needed);
      });
      refiningSteps.push({ output: alloyName, outputQty: neededQty, ingredients: ings });
    }
    expandRefining(alloy, qty);

    // ── Phase B: Collect raw extractable leaf materials ──────────────────
    // rawNeeds: { materialName -> totalNeeded }
    const rawNeeds = {};
    refiningSteps.forEach(step => {
      step.ingredients.forEach(({ name, needed }) => {
        if (!REFINING_RECIPES[name]) {
          rawNeeds[name] = (rawNeeds[name] || 0) + needed;
        }
      });
    });

    // ── Phase C: For each raw material, find best extraction source ──────
    // Build: extractionMap[oreName] -> { oreNeeded, stacks, steps:[{material,needed,machine,catalyst,ratio,intermediate?}] }
    // "intermediate" = the ore isn't directly mineable; e.g. Blood Ore comes FROM Granum
    // We want to separate:
    //   miningMap[rawOreName] -> total units to mine (Granum, Calx, Saburra...)
    //   extractionStepList = ordered steps: Granum→Blood Ore, Blood Ore→Pig Iron, Calx→Calx Powder+Coal, etc.

    const miningMap = {}; // raw mineable ore -> { oreNeeded, stacks }
    const extractionStepList = []; // [{from, to, needed, machine, catalyst, ratio, isSubStep}]
    const addedExtrSteps = new Set();

    function resolveExtraction(material, needed) {
      const src = bestSourceFor(material, allowDangerous);
      if (!src) return;

      const oreName = src.type === "ore" ? src.ore : src.input;
      const yieldPer = (src.ratio / 10000) * mult;
      const inputNeeded = needed / yieldPer;

      // Record this extraction step (ore/sub → material)
      const stepKey = `${oreName}->${material}`;
      if (!addedExtrSteps.has(stepKey)) {
        addedExtrSteps.add(stepKey);
        extractionStepList.push({ from: oreName, to: material, needed, inputNeeded, machine: src.machine, catalyst: src.catalyst, ratio: src.ratio });
      } else {
        // Already added — just increase amounts
        const existing = extractionStepList.find(s => s.from === oreName && s.to === material);
        if (existing) { existing.needed += needed; existing.inputNeeded += inputNeeded; }
      }

      if (src.type === "sub" && !RECIPES[src.input]) {
        // The source is itself extracted (e.g. Blood Ore from Granum)
        resolveExtraction(oreName, inputNeeded);
      } else {
        // oreName is a real mineable ore
        if (!miningMap[oreName]) miningMap[oreName] = { oreNeeded: 0 };
        miningMap[oreName].oreNeeded += inputNeeded;
      }
    }

    Object.entries(rawNeeds).forEach(([mat, needed]) => resolveExtraction(mat, needed));
    Object.values(miningMap).forEach(o => { o.stacks = o.oreNeeded / 10000; });

    // Sort mining by amount desc
    const sortedMining = Object.entries(miningMap).sort((a,b) => b[1].oreNeeded - a[1].oreNeeded);

    // ── Order extraction steps chain-by-chain, ore by ore ───────────────
    // For each mineable ore (in mining order), follow the full chain:
    //   Ore → Material → Further Processed Material → ...
    // Build a lookup: from → [step]
    const stepsByFrom = {};
    extractionStepList.forEach(s => {
      if (!stepsByFrom[s.from]) stepsByFrom[s.from] = [];
      stepsByFrom[s.from].push(s);
    });

    const orderedExtr = [];
    const addedToOrdered = new Set();
    function followChain(fromNode) {
      const steps = stepsByFrom[fromNode] || [];
      steps.forEach(s => {
        const key = `${s.from}->${s.to}`;
        if (addedToOrdered.has(key)) return;
        addedToOrdered.add(key);
        orderedExtr.push(s);
        followChain(s.to); // follow this output further down the chain
      });
    }
    // Walk in mining order (biggest ore first) so chains appear grouped
    sortedMining.forEach(([oreName]) => followChain(oreName));

    // ── Detect hidden dangerous-machine paths ────────────────────────────
    // If dangerous machines are OFF, check which materials have a dangerous-machine
    // source that either (a) produces a different/additional ore, or (b) has higher yield.
    const hiddenWarnings = [];
    if (!allowDangerous) {
      Object.entries(rawNeeds).forEach(([mat]) => {
        const safeSrc  = bestSourceFor(mat, false);
        const dangSrc  = bestSourceFor(mat, true);
        if (!dangSrc) return;
        const safeOreName = safeSrc ? (safeSrc.type==="ore" ? safeSrc.ore : safeSrc.input) : null;
        const dangOreName = dangSrc.type==="ore" ? dangSrc.ore : dangSrc.input;
        const isDifferentOre = safeOreName !== dangOreName;
        const isBetterYield  = !safeSrc || dangSrc.ratio > safeSrc.ratio;
        if (isDifferentOre || isBetterYield) {
          hiddenWarnings.push({
            material: mat,
            safeOre: safeOreName,
            safeMachine: safeSrc ? safeSrc.machine : null,
            safeRatio: safeSrc ? safeSrc.ratio : null,
            dangOre: dangOreName,
            dangMachine: dangSrc.machine,
            dangRatio: dangSrc.ratio,
          });
        }
      });
    }

    setResult({ alloy, qty, sortedMining, orderedExtr, refiningSteps, hiddenWarnings });
  }

  const STEP_COLORS = ["var(--green)","var(--blue)","var(--purple)","var(--gold)"];

  function StepCard({ children, color, label, title, badge, badgeClass }) {
    return React.createElement('div', {

        background:"var(--bg1)", border:"0.5px solid var(--border)",
        borderRadius:"var(--r-md)", padding:"12px 14px", marginBottom:8,
        borderLeft:`3px solid ${color}`
      }
    },
      React.createElement('div', { style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6} },
        React.createElement('div', null,
          label && React.createElement('span', { style:{fontSize:10,color:"var(--text3)",marginRight:8,textTransform:"uppercase",letterSpacing:"0.06em"} }, label),
          React.createElement('span', { style:{fontSize:14,fontWeight:600,color:"var(--text1)"} }, title)
        ),
        badge && React.createElement('span', { className:`badge ${badgeClass||"badge-green"}` }, badge)
      ),
      children
    );
  }

  return React.createElement('div',null,
    React.createElement('div',{className:'rs-card'},
      React.createElement('div',{style:{marginBottom:12,fontSize:13,color:"var(--text2)"}},"Enter your target alloy and quantity for a complete step-by-step production guide — from raw ore in the ground to finished material."),
      React.createElement('div',{className:'rs-row'},
        React.createElement('div',{className:'rs-field',style:{flex:2}},
          React.createElement('span',{className:'rs-label'},"Target Alloy"),
          React.createElement('select',{value:alloy,onChange:e=>setAlloy(e.target.value)},
            alloys.map(a=>React.createElement('option',{key:a,value:a},a))
          )
        ),
        React.createElement('div',{className:'rs-field',style:{flex:2}},
          React.createElement('span',{className:'rs-label'},"Desired Amount"),
          React.createElement('input',{type:"text",placeholder:"e.g. 10000",value:amount,onChange:e=>setAmount(e.target.value),
            onKeyDown:e=>e.key==="Enter"&&calculate()})
        ),
        React.createElement('button',{className:'rs-btn',onClick:calculate},"Calculate")
      ),

      result && React.createElement('div',{className:'rs-result'},

        // ── Warning: hidden dangerous-machine paths ───────────────────────
        result.hiddenWarnings && result.hiddenWarnings.length > 0 &&
        React.createElement('div',{className:'danger-warning'},
          React.createElement('div',{className:'danger-warning-title'},
            "⚠ This result is INCOMPLETE — some materials require Greater Nat or Blast Furnace"),
          React.createElement('div',{style:{fontSize:11,color:"#c8a07a",marginBottom:8}},
            "The following ingredients have better or different sources locked behind dangerous machines. "
            +"Enable the toggle above to see the full recipe including those ores."),
          result.hiddenWarnings.map(w =>
            React.createElement('div',{key:w.material, className:'danger-warning-row'},
              React.createElement('span',null, `→ `),
              React.createElement('span',{className:'danger-warning-highlight'}, w.material),
              w.safeOre
                ? React.createElement('span',null,
                    `currently from ${w.safeOre} (${w.safeRatio/100}%) — `,
                    React.createElement('span',{className:'danger-warning-highlight'},
                      `better route via ${w.dangMachine}: ${w.dangOre} (${w.dangRatio/100}%)`)
                  )
                : React.createElement('span',{className:'danger-warning-highlight'},
                    `⚠ NO safe source found — requires ${w.dangMachine} from ${w.dangOre}`)
            )
          )
        ),
        React.createElement('div',{style:{marginBottom:18}},
          React.createElement('div',{className:'rs-section-title',style:{color:"var(--gold)",fontSize:12,marginBottom:10}},
            "⛏ PHASE 1 — MINING  (collect these ores first, biggest pile first)"),
          result.sortedMining.map(([oreName, info], i) =>
            React.createElement('div',{key:oreName,style:{
              display:"flex", justifyContent:"space-between", alignItems:"center",
              background:"var(--bg1)", border:"0.5px solid var(--border)",

            }},
              React.createElement('span',{style:{fontSize:14,fontWeight:600,color:"var(--text1)"}},`⛏ Mine ${oreName}`),
              React.createElement('div',{style:{display:"flex",gap:6}},
                React.createElement('span',{className:'badge badge-gold'},fmt(info.oreNeeded)+" units"),
                React.createElement('span',{className:'badge badge-blue'},fmt(info.stacks)+" stacks")
              )
            )
          )
        ),

        // ── PHASE 2: Extraction steps ─────────────────────────────────────
        result.orderedExtr.length > 0 &&
        React.createElement('div',{style:{marginBottom:18}},
          React.createElement('div',{className:'rs-section-title',style:{color:"var(--green)",fontSize:12,marginBottom:10}},
            "⚙ PHASE 2 — EXTRACTION  (process your ores, chain by chain)"),
          (() => {
            // Insert a subtle ore-group divider whenever the root ore changes
            const elements = [];
            let currentRootOre = null;

              }

              elements.push(
                React.createElement(StepCard,{key:s.from+"->"+s.to, color,

                    `${MACHINE_ICONS[s.machine]||"⚙"} ${s.machine} · Catalyst: ${s.catalyst} · Yield: ${(s.ratio/100).toFixed(2)}%`
                    +(buffKey!=="none"?` (×${BUFF_MULTIPLIERS[buffKey]} buffed)`:"")),

//  BEST PATH TAB
// ══════════════════════════════════════════════════════
// Graph traversal: given a starting ore/amount and a target material,
// find all paths through extraction + sub-recipes that lead to that target.

// Build a forward graph: material -> [ {to, ratio, machine, catalyst, recipeIdx, source} ]
function buildForwardGraph(allowDangerous) {
  const graph = {};
  const addEdge = (from, to, meta) => {
    if (!allowDangerous && DANGEROUS_MACHINES.has(meta.machine)) return;
    if (!graph[from]) graph[from] = [];
    graph[from].push({ to, ...meta });
  };
  Object.entries(RECIPES).forEach(([ore, recipes]) => {
    recipes.forEach((r, ri) => {
      Object.entries(r.outputs).forEach(([mat, ratio]) => {
        addEdge(ore, mat, { ratio, machine:r.machine, catalyst:r.catalyst, recipeIdx:ri });
      });
    });
  });
  Object.entries(SUB_RECIPES).forEach(([input, recipes]) => {
    recipes.forEach((r, ri) => {
      Object.entries(r.outputs).forEach(([mat, ratio]) => {
        addEdge(input, mat, { ratio, machine:r.machine, catalyst:r.catalyst, recipeIdx:ri });
      });
    });
  });
  return graph;
}

// DFS to find all paths from start to target (max depth 8)
function findAllPaths(start, target, graph, maxDepth=8) {
  const paths = [];
  function dfs(node, path, visited) {
    if (path.length > maxDepth) return;
    if (node === target) { paths.push([...path]); return; }
    const edges = graph[node] || [];
    edges.forEach(edge => {
      if (!visited.has(edge.to)) {
        visited.add(edge.to);
        path.push(edge);
        dfs(edge.to, path, visited);
        path.pop();
        visited.delete(edge.to);
      }
    });
  }
  dfs(start, [], new Set([start]));
  return paths;
}

// Compute final yield for a path given starting qty
function pathYield(path, startQty, mult) {
  let qty = startQty;
  path.forEach(edge => {
    qty = qty * (edge.ratio / 10000) * mult;
  });
  return qty;
}

function BestPathTab({ buffKey }) {
  const mult = BUFF_MULTIPLIERS[buffKey];
  const allowDangerous = useContext(DangerContext);
  const ores = Object.keys(RECIPES);
  // Collect all possible targets (everything that can be produced)
  const allTargets = [...new Set([
    ...Object.values(RECIPES).flatMap(rs=>rs.flatMap(r=>Object.keys(r.outputs))),
    ...Object.values(SUB_RECIPES).flatMap(rs=>rs.flatMap(r=>Object.keys(r.outputs))),
  ])].sort();

  const [ore, setOre] = useState("Calx");
  const [target, setTarget] = useState("Skadite");
  const [amount, setAmount] = useState("");
  const [paths, setPaths] = useState(null);
  const [selectedPath, setSelectedPath] = useState(0);

  function calculate() {
    const qty = parseFloat(amount.replace(/,/g,""));
    if (!qty || qty<=0) return;
    const graph = buildForwardGraph(allowDangerous);
    const found = findAllPaths(ore, target, graph);
    if (found.length===0) { setPaths([]); return; }

    const scored = found.map((p,i)=>{
      // Compute byproducts: at each step, look up all outputs of that recipe.
      // The "main" output is edge.to; everything else from that same recipe is a byproduct.
      const byproducts = {}; // name -> qty
      let runningQty = qty;
      p.forEach(edge => {
        const mainQty = runningQty * (edge.ratio / 10000) * mult;
        // Find the full recipe this edge came from
        const recipeList = RECIPES[ore] ? null : null; // we need to look up the source
        // Look in RECIPES (top-level ore) and SUB_RECIPES for this edge's from-node
        // edge doesn't store the "from" node, so we reconstruct from path index
        // Instead, look up all outputs of the machine+material combo
        const allOutputs = (() => {
          // find which recipe set contains this edge
          for (const [src, recs] of Object.entries(RECIPES)) {
            for (const r of recs) {
              if (r.machine === edge.machine && r.catalyst === edge.catalyst && r.outputs[edge.to] === edge.ratio) {
                return Object.entries(r.outputs);
              }
            }
          }
          for (const [src, recs] of Object.entries(SUB_RECIPES)) {
            for (const r of recs) {
              if (r.machine === edge.machine && r.catalyst === edge.catalyst && r.outputs[edge.to] === edge.ratio) {
                return Object.entries(r.outputs);
              }
            }
          }
          return [];
        })();

        // The input qty for this step is runningQty; each output scales by its own ratio
        allOutputs.forEach(([prod, prodRatio]) => {
          if (prod === edge.to) return; // main output, skip
          const bpQty = runningQty * (prodRatio / 10000) * mult;
          byproducts[prod] = (byproducts[prod] || 0) + bpQty;
        });

        runningQty = mainQty;
      });

      return { path:p, yield: pathYield(p,qty,mult), byproducts, idx:i };
    }).sort((a,b)=>b.yield-a.yield);

    setPaths(scored);
    setSelectedPath(0);
  }

  const TIER_COLORS = ["var(--green)","var(--blue)","var(--purple)","var(--gold)"];

  return React.createElement('div',null,
    React.createElement('div',{className:'bp-card'},
      React.createElement('div',{style:{marginBottom:12,fontSize:13,color:"var(--text2)"}},"Find the most efficient route from a raw ore to any target material. All paths are shown, sorted by final yield."),
      React.createElement('div',{className:'rs-row'},
        React.createElement('div',{className:'rs-field',style:{flex:2}},
          React.createElement('span',{className:'rs-label'},"Starting Ore"),
          React.createElement('select',{value:ore,onChange:e=>setOre(e.target.value)},
            ores.map(o=>React.createElement('option',{key:o,value:o},o))
          )
        ),
        React.createElement('div',{className:'rs-field',style:{flex:2}},
          React.createElement('span',{className:'rs-label'},"Target Material"),
          React.createElement('select',{value:target,onChange:e=>setTarget(e.target.value)},
            allTargets.map(t=>React.createElement('option',{key:t,value:t},t))
          )
        ),
        React.createElement('div',{className:'rs-field',style:{flex:1.5}},
          React.createElement('span',{className:'rs-label'},"Amount"),
          React.createElement('input',{type:"text",placeholder:"e.g. 10000",value:amount,
            onChange:e=>setAmount(e.target.value),onKeyDown:e=>e.key==="Enter"&&calculate()})
        ),
        React.createElement('button',{className:'rs-btn',onClick:calculate},"Find Paths")
      ),

      paths !== null && paths.length === 0 && React.createElement('div',{className:'no-path'},
        "No path found from "+ore+" to "+target+". These materials may not be connected in the extraction chain."
      ),

      paths !== null && paths.length > 0 && React.createElement('div',null,
        // Path selector when multiple options exist
        paths.length > 1 && React.createElement('div',{style:{marginBottom:14}},
          React.createElement('div',{style:{fontSize:11,textTransform:"uppercase",letterSpacing:"0.07em",color:"var(--text3)",marginBottom:8}},"Found "+paths.length+" paths — sorted by yield"),
          React.createElement('div',{className:'path-options'},
            paths.slice(0,5).map((p,i)=>
              React.createElement('button',{
                key:i, className:`path-option-btn${selectedPath===i?" selected":""}`,
                onClick:()=>setSelectedPath(i)
              },
                React.createElement('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
                  React.createElement('span',{style:{fontSize:13,color:"var(--text1)"}},
                    (i===0?"🏆 Best: ":"Path "+(i+1)+": ")+p.path.map(e=>e.to).join(" → ")),
                  React.createElement('span',{className:'badge badge-green'},fmt(p.yield)+" "+target)
                ),
                React.createElement('div',{style:{fontSize:11,color:"var(--text3)",marginTop:3}},
                  p.path.length+" steps · "+p.path.map(e=>`${MACHINE_ICONS[e.machine]||"⚙"} ${e.machine}`).join(" → "))
              )
            )
          )
        ),

        // Detailed step breakdown for selected path
        React.createElement('div',{style:{marginTop:14}},
          React.createElement('div',{style:{fontSize:11,textTransform:"uppercase",letterSpacing:"0.07em",color:"var(--text3)",marginBottom:10}},
            selectedPath===0&&paths.length>1?"✅ Best Path — Step by Step":"Path Details"),
          (() => {
            const p = paths[selectedPath];
            let runningQty = parseFloat(amount.replace(/,/g,""))||0;
            const steps = [];
            steps.push({ label: ore, qty: runningQty, isSrc: true });
            p.path.forEach((edge,i) => {
              runningQty = runningQty * (edge.ratio/10000) * mult;
              steps.push({ label: edge.to, qty: runningQty, machine: edge.machine, catalyst: edge.catalyst, ratio: edge.ratio, tier: i });
            });
            return steps.map((s,i) => {
              if (s.isSrc) return React.createElement('div',{key:i,style:{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:"var(--bg2)",borderRadius:"var(--r-md)",marginBottom:6}},
                React.createElement('span',{style:{fontSize:18}},MACHINE_ICONS["Crusher"]||"⛏"),
                React.createElement('div',null,
                  React.createElement('div',{style:{fontSize:13,fontWeight:500,color:"var(--text1)"}},s.label+" (starting ore)"),
                  React.createElement('div',{style:{fontSize:12,color:"var(--text2)"}},fmt(s.qty)+" units")
                )
              );
              return React.createElement('div',{key:i},
                React.createElement('div',{className:'bp-arrow'},"↓"),
                React.createElement('div',{className:`bp-step tier${Math.min(s.tier,3)}`},
                  React.createElement('div',{className:'bp-step-num'},"S"+(i)),
                  React.createElement('div',{className:'bp-step-body'},
                    React.createElement('div',{className:'bp-step-title'},
                      `${MACHINE_ICONS[s.machine]||"⚙"} ${s.machine} → `,
                      React.createElement('span',{style:{color:TIER_COLORS[Math.min(s.tier,3)]}},s.label)
                    ),
                    React.createElement('div',{className:'bp-step-detail'},
                      `Catalyst: ${s.catalyst} · Base ratio: ${s.ratio/100}%`+(buffKey!=="none"?` · With buff: ${((s.ratio/10000)*mult*100).toFixed(2)}%`:"")
                    )
                  ),
                  React.createElement('span',{className:'badge badge-green',style:{whiteSpace:"nowrap"}},fmt(s.qty))
                )
              );
            });
          })()
        ),
        React.createElement('div',{className:'bp-final'},
          React.createElement('div',null,
            React.createElement('div',{style:{fontSize:11,color:"var(--text2)",marginBottom:2}},"Final output from "+fmt(parseFloat(amount.replace(/,/g,""))||0)+" "+ore),
            React.createElement('div',{style:{fontSize:15,fontWeight:600,color:"var(--text1)"}},target)
          ),
          React.createElement('span',{className:'badge badge-green',style:{fontSize:15,padding:"4px 14px"}},
            fmt(paths[selectedPath].yield)+" units")
        ),
        // Byproducts panel
        (() => {
          const bp = paths[selectedPath].byproducts;
          const entries = Object.entries(bp).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
          if (entries.length === 0) return null;
          return React.createElement('div',{className:'bp-byproducts'},
            React.createElement('div',{className:'bp-byproducts-title'},"🧪 Byproducts along this path"),
            entries.map(([name, qty])=>
              React.createElement('div',{key:name,className:'bp-byproduct-row'},
                React.createElement('span',{style:{color:"var(--text2)"}},name),
                React.createElement('span',{className:'badge badge-blue'},fmt(qty))
              )
            )
          );
        })()
      )
    )
  );
}

// ══════════════════════════════════════════════════════
//  ROOT APP
// ══════════════════════════════════════════════════════
function App() {
  const [tab, setTab] = useState("extract");
  const [buffKey, setBuffKey] = useState("none");
  const [allowDangerous, setAllowDangerous] = useState(false);
  const mult = BUFF_MULTIPLIERS[buffKey];

  const TABS = [
    { key:"extract", label:"⛏ Extraction" },
    { key:"reverse", label:"🔥 Refining" },
    { key:"bestpath", label:"🏆 Best Path" },
  ];

  return React.createElement(BuffContext.Provider,{value:mult},
    React.createElement(DangerContext.Provider,{value:allowDangerous},
      React.createElement('div',{style:{padding:"1rem 0",maxWidth:720,margin:"0 auto"}},
        React.createElement('h2',{style:{fontSize:18,fontWeight:500,marginBottom:4}},"Mortal Online 2 — Extraction Chain Calculator"),
        React.createElement('p',{style:{fontSize:13,color:"var(--text2)",marginBottom:16}},"Extract, refine, and plan your material chains."),
        React.createElement('div',{className:'tabs'},
          TABS.map(t=>React.createElement('button',{
            key:t.key, className:`tab-btn${tab===t.key?" active":""}`,
            onClick:()=>setTab(t.key)
          },t.label))
        ),
        React.createElement(BuffBar,{buffKey,setBuffKey}),
        React.createElement(DangerBar,{allowDangerous,setAllowDangerous}),
        tab==="extract"  && React.createElement(ExtractionTab,null),
        tab==="reverse"  && React.createElement(ReverseSearchTab,{buffKey}),
        tab==="bestpath" && React.createElement(BestPathTab,{buffKey}),
      )
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
