<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mortal Online 2 — Extraction Chain Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
  :root {
    --color-background-primary: #1a1c22;
    --color-background-secondary: #12141a;
    --color-background-info: #1a2a3a;
    --color-border-tertiary: #2e3140;
    --color-text-primary: #e8eaf0;
    --color-text-secondary: #8891a8;
    --color-text-tertiary: #4e5570;
    --color-text-info: #5ba8f5;
    --border-radius-lg: 10px;
    --border-radius-md: 6px;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0f14;
    color: var(--color-text-primary);
    min-height: 100vh;
    padding: 24px 16px;
  }

  input, select {
    background: var(--color-background-secondary);
    border: 1px solid var(--color-border-tertiary);
    color: var(--color-text-primary);
    border-radius: var(--border-radius-md);
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
    width: 100%;
  }
  input:focus, select:focus { border-color: #378ADD66; }
  select option { background: #1a1c22; }
  button { font-family: inherit; }

  .buff-toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 13px;
    border-radius: 20px;
    border: 1px solid var(--color-border-tertiary);
    background: var(--color-background-secondary);
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .buff-toggle:hover {
    border-color: #378ADD55;
    color: var(--color-text-primary);
  }
  .buff-toggle.active-cm {
    background: #1a2e1f;
    border-color: #1D9E75;
    color: #1D9E75;
  }
  .buff-toggle.active-cmo {
    background: #1e2538;
    border-color: #378ADD;
    color: #378ADD;
  }
  .buff-toggle .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.7;
  }
  .buff-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    margin-bottom: 18px;
  }
  .buff-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
    margin-right: 2px;
  }
  .buff-active-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    margin-left: auto;
  }
  .buff-active-badge.cm  { background: #1a2e1f; color: #1D9E75; }
  .buff-active-badge.cmo { background: #1e2538; color: #378ADD; }
  .buff-active-badge.none { background: transparent; color: var(--color-text-tertiary); }
</style>
</head>
<body>
<div id="root"></div>

const fmt = (n) => Math.round(n).toLocaleString();

const MACHINE_ICONS = {
  Crusher: "⚙", Grinder: "🔩", Furnace: "🔥", "Blast Furnace": "♨",
  Attractor: "🧲", "Greater Nat": "🌀", Natorus: "⚗", Fabricula: "🏭",
  Grizzly: "🪨", Kiln: "🏺", Hearth: "🪵",
};

const TIER_STYLE = [
  { bg: "var(--color-background-secondary)", accent: "#1D9E75" },
  { bg: "var(--color-background-primary)", accent: "#378ADD" },
  { bg: "var(--color-background-secondary)", accent: "#7F77DD" },
];

// ── Buff toggle bar ──────────────────────────────────────────────────────────
function BuffBar({ buffKey, setBuffKey }) {
  const BUFFS = [
    { key: "none", label: "No Buff", pct: null, cls: "" },
    { key: "cm",   label: "Clade + Mastery", pct: "+8.45%", cls: "active-cm" },
    { key: "cmo",  label: "Clade + Mastery + Outpost", pct: "+13.45%", cls: "active-cmo" },
  ];

  const active = BUFFS.find(b => b.key === buffKey);

  return React.createElement('div', { className: 'buff-bar' },
    React.createElement('span', { className: 'buff-label' }, "⚡ Buff"),
    BUFFS.map(b =>
      React.createElement('button', {
        key: b.key,
        className: `buff-toggle${buffKey === b.key ? ' ' + b.cls : ''}`,
        onClick: () => setBuffKey(b.key),
      },
        buffKey === b.key && React.createElement('span', { className: 'dot' }),
        b.label,
        b.pct && React.createElement('span', {
          style: { opacity: 0.75, fontSize: 11 }
        }, ` ${b.pct}`)
      )
    ),
    buffKey !== "none" && React.createElement('span', {
      className: `buff-active-badge ${buffKey}`
    }, active.pct + " yield")
  );
}

// ── Sub-recipe expander ──────────────────────────────────────────────────────
function RecipeSelect({ material, qty, depth }) {
  const mult = useContext(BuffContext);
  const recipes = SUB_RECIPES[material];
  const [open, setOpen] = useState(false);
  const [recipeIdx, setRecipeIdx] = useState(0);

  if (!recipes || qty <= 0) return null;

  const recipe = recipes[recipeIdx];
  const ts = TIER_STYLE[Math.min(depth, 2)];

  return React.createElement('div', {
    style: {
      marginTop: 6,
      marginLeft: depth === 0 ? 0 : 16,
      borderLeft: `2px solid ${ts.accent}22`,
      paddingLeft: 12,
    }
  },
    React.createElement('button', {
      onClick: () => setOpen(o => !o),
      style: {
        display: "flex", alignItems: "center", gap: 8,
        background: "none", border: "none", cursor: "pointer",
        padding: "4px 0", width: "100%",
      }
    },
      React.createElement('span', {
        style: { fontSize: 11, fontWeight: 500, color: ts.accent, textTransform: "uppercase", letterSpacing: "0.06em" }
      }, `${open ? "▾" : "▸"} ${material} → process`)
    ),

    open && React.createElement('div', {
      style: {
        background: ts.bg,
        border: `0.5px solid var(--color-border-tertiary)`,
        borderRadius: "var(--border-radius-md)",
        padding: "10px 12px", marginTop: 4,
      }
    },
      React.createElement('div', { style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 10 } },
        React.createElement('span', { style: { fontSize: 12, color: "var(--color-text-secondary)", whiteSpace: "nowrap" } }, "Machine"),
        React.createElement('select', {
          value: recipeIdx,
          onChange: e => setRecipeIdx(Number(e.target.value)),
          style: { fontSize: 12, flex: 1, minWidth: 0 }
        },
          recipes.map((r, i) =>
            React.createElement('option', { key: i, value: i },
              `${MACHINE_ICONS[r.machine] || "⚙"} ${r.machine} — ${r.catalyst}`)
          )
        )
      ),
      Object.entries(recipe.outputs).map(([prod, ratio]) => {
        // Each refining step gets the buff applied to its output
        const outQty = qty * (ratio / 10000) * mult;
        return React.createElement('div', { key: prod },
          React.createElement('div', {
            style: {
              display: "flex", justifyContent: "space-between",
              alignItems: "center", padding: "4px 0",
              borderBottom: "0.5px solid var(--color-border-tertiary)",
            }
          },
            React.createElement('span', { style: { fontSize: 13, color: "var(--color-text-primary)" } }, prod),
            React.createElement('span', {
              style: { fontSize: 13, fontWeight: 500, color: ts.accent, fontVariantNumeric: "tabular-nums" }
            }, fmt(outQty))
          ),
          React.createElement(RecipeSelect, { material: prod, qty: outQty, depth: depth + 1 })
        );
      })
    )
  );
}

// ── Ore card ─────────────────────────────────────────────────────────────────
function OreCard({ ore }) {
  const mult = useContext(BuffContext);
  const [amount, setAmount] = useState("");
  const [recipeIdx, setRecipeIdx] = useState(0);
  const [open, setOpen] = useState(false);

  const recipes = RECIPES[ore];
  const recipe = recipes[recipeIdx];
  const qty = parseFloat(amount.replace(/,/g, "")) || 0;

  return React.createElement('div', {
    style: {
      background: "var(--color-background-primary)",
      border: "0.5px solid var(--color-border-tertiary)",
      borderRadius: "var(--border-radius-lg)",
      overflow: "hidden", marginBottom: 12,
    }
  },
    React.createElement('button', {
      onClick: () => setOpen(o => !o),
      style: {
        width: "100%", display: "flex", alignItems: "center",
        justifyContent: "space-between", padding: "14px 16px",
        background: open ? "var(--color-background-secondary)" : "var(--color-background-primary)",
        border: "none", cursor: "pointer",
        borderBottom: open ? "0.5px solid var(--color-border-tertiary)" : "none",
      }
    },
      React.createElement('div', { style: { display: "flex", alignItems: "center", gap: 10 } },
        React.createElement('span', {
          style: { fontSize: 11, fontWeight: 500, letterSpacing: "0.08em", color: "var(--color-text-secondary)", textTransform: "uppercase" }
        }, "⛏"),
        React.createElement('span', { style: { fontSize: 15, fontWeight: 500, color: "var(--color-text-primary)" } }, ore),
        qty > 0 && React.createElement('span', {
          style: { fontSize: 11, background: "var(--color-background-info)", color: "var(--color-text-info)", borderRadius: "var(--border-radius-md)", padding: "2px 8px" }
        }, fmt(qty))
      ),
      React.createElement('span', { style: { fontSize: 12, color: "var(--color-text-tertiary)" } }, open ? "▲" : "▼")
    ),

    open && React.createElement('div', { style: { padding: "14px 16px" } },
      React.createElement('div', { style: { display: "flex", gap: 10, marginBottom: 14, alignItems: "center" } },
        React.createElement('div', { style: { flex: 1 } },
          React.createElement('div', { style: { fontSize: 11, color: "var(--color-text-secondary)", marginBottom: 4 } }, "Amount"),
          React.createElement('input', {
            type: "text", placeholder: "e.g. 100000", value: amount,
            onChange: e => setAmount(e.target.value),
            style: { width: "100%", boxSizing: "border-box" }
          })
        ),
        React.createElement('div', { style: { flex: 2 } },
          React.createElement('div', { style: { fontSize: 11, color: "var(--color-text-secondary)", marginBottom: 4 } }, "Machine"),
          React.createElement('select', {
            value: recipeIdx,
            onChange: e => setRecipeIdx(Number(e.target.value)),
            style: { width: "100%" }
          },
            recipes.map((r, i) =>
              React.createElement('option', { key: i, value: i },
                `${MACHINE_ICONS[r.machine] || "⚙"} ${r.machine} — ${r.catalyst}`)
            )
          )
        )
      ),

      qty > 0 && React.createElement('div', {
        style: { background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)", padding: "10px 12px" }
      },
        React.createElement('div', {
          style: { fontSize: 11, fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.07em", color: "#1D9E75", marginBottom: 8 }
        }, "Tier 1 — direct extracts"),
        Object.entries(recipe.outputs).map(([prod, ratio]) => {
          // Tier-1 extraction also benefits from the buff
          const outQty = qty * (ratio / 10000) * mult;
          return React.createElement('div', { key: prod },
            React.createElement('div', {
              style: {
                display: "flex", justifyContent: "space-between",
                alignItems: "center", padding: "5px 0",
                borderBottom: "0.5px solid var(--color-border-tertiary)",
              }
            },
              React.createElement('span', { style: { fontSize: 13, color: "var(--color-text-primary)" } }, prod),
              React.createElement('span', { style: { fontSize: 14, fontWeight: 500, color: "#1D9E75", fontVariantNumeric: "tabular-nums" } }, fmt(outQty))
            ),
            React.createElement(RecipeSelect, { material: prod, qty: outQty, depth: 0 })
          );
        })
      ),

      qty === 0 && React.createElement('div', {
        style: { textAlign: "center", padding: "20px 0", fontSize: 13, color: "var(--color-text-tertiary)" }
      }, "Enter an amount above to see extraction results")
    )
  );
}

// ── Root App ──────────────────────────────────────────────────────────────────
const BUFF_MULTIPLIERS = { none: 1, cm: 1.0845, cmo: 1.1345 };

function App() {
  const [buffKey, setBuffKey] = useState("none");
  const mult = BUFF_MULTIPLIERS[buffKey];

  return React.createElement(BuffContext.Provider, { value: mult },
    React.createElement('div', { style: { padding: "1rem 0", maxWidth: 680, margin: "0 auto" } },
      React.createElement('h2', { style: { fontSize: 18, fontWeight: 500, marginBottom: 4 } },
        "Mortal Online 2 — Extraction Chain Calculator"),
      React.createElement('p', { style: { fontSize: 13, color: "var(--color-text-secondary)", marginBottom: 16 } },
        "Select an ore, enter your amount, pick a machine, then expand any output to process it further."),
      React.createElement(BuffBar, { buffKey, setBuffKey }),
      Object.keys(RECIPES).map(ore =>
        React.createElement(OreCard, { key: ore, ore: ore })
      )
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
