<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mortal Online 2 — Extraction Chain Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
  :root {
    --bg0: #0d0f14;
    --bg1: #1a1c22;
    --bg2: #12141a;
    --bg3: #1e2028;
    --border: #2e3140;
    --text1: #e8eaf0;
    --text2: #8891a8;
    --text3: #4e5570;
    --info-bg: #1a2a3a;
    --info-text: #5ba8f5;
    --green: #1D9E75;
    --blue: #378ADD;
    --purple: #7F77DD;
    --gold: #c9a227;
    --r-lg: 10px;
    --r-md: 6px;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg0); color: var(--text1); min-height: 100vh; padding: 24px 16px; }
  input, select {
    background: var(--bg2); border: 1px solid var(--border);
    color: var(--text1); border-radius: var(--r-md);
    padding: 7px 10px; font-size: 13px; outline: none; width: 100%;
  }
  input:focus, select:focus { border-color: #378ADD66; }
  select option { background: var(--bg1); }
  button { font-family: inherit; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
  .tab-btn {
    padding: 8px 18px; font-size: 13px; font-weight: 500;
    background: none; border: none; cursor: pointer;
    color: var(--text2); border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all 0.15s;
  }
  .tab-btn:hover { color: var(--text1); }
  .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }

  /* Buff bar */
  .buff-toggle {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 13px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--bg2);
    color: var(--text2); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .buff-toggle:hover { border-color: #378ADD55; color: var(--text1); }
  .buff-toggle.active-cm  { background: #1a2e1f; border-color: var(--green); color: var(--green); }
  .buff-toggle.active-cmo { background: #1e2538; border-color: var(--blue);  color: var(--blue);  }
  .buff-toggle .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.7; }
  .buff-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--bg2);
    border: 0.5px solid var(--border); border-radius: var(--r-lg); margin-bottom: 18px;
  }
  .buff-label { font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text3); margin-right: 2px; }
  .buff-active-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; margin-left: auto; }
  .buff-active-badge.cm  { background: #1a2e1f; color: var(--green); }
  .buff-active-badge.cmo { background: #1e2538; color: var(--blue);  }

  /* Danger toggle */
  .danger-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--bg2);
    border: 0.5px solid var(--border); border-radius: var(--r-lg); margin-bottom: 18px;
  }
  .danger-label { font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text3); }
  .danger-toggle {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text2); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; white-space: nowrap; user-select: none;
  }
  .danger-toggle:hover { border-color: #e05a3a55; }
  .danger-toggle.on  { background: #2a1a14; border-color: #e05a3a; color: #e05a3a; }
  .danger-toggle.off { background: #1a2e1f; border-color: var(--green); color: var(--green); }
  .danger-toggle .tog-track {
    width: 28px; height: 15px; border-radius: 8px; background: currentColor;
    opacity: 0.3; position: relative; transition: all 0.15s; flex-shrink: 0;
  }
  .danger-toggle .tog-knob {
    position: absolute; top: 2px; width: 11px; height: 11px;
    border-radius: 50%; background: currentColor; opacity: 1;
    transition: left 0.15s;
  }
  .danger-toggle.on  .tog-knob { left: 15px; }
  .danger-toggle.off .tog-knob { left: 2px; }

  /* Reverse search */
  .rs-card { background: var(--bg1); border: 0.5px solid var(--border); border-radius: var(--r-lg); padding: 16px; margin-bottom: 12px; }
  .rs-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 14px; }
  .rs-field { display: flex; flex-direction: column; gap: 4px; }
  .rs-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; }
  .rs-btn {
    padding: 8px 18px; background: var(--blue); border: none;

  .rs-result { background: var(--bg2); border-radius: var(--r-md); padding: 12px 14px; }
  .rs-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; margin-bottom: 10px; }
  .rs-ingredient-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; border-bottom: 0.5px solid var(--border);
    font-size: 13px;
  }
  .rs-ingredient-row:last-child { border-bottom: none; }
  .rs-ore-section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .rs-ore-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; border-bottom: 0.5px solid var(--border); font-size: 13px;
  }
  .rs-ore-row:last-child { border-bottom: none; }

    font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500;

  .badge-blue  { background: var(--info-bg); color: var(--info-text); }
  .badge-purple{ background: #21203a; color: var(--purple); }

  /* Best path */
  .bp-card { background: var(--bg1); border: 0.5px solid var(--border); border-radius: var(--r-lg); padding: 16px; margin-bottom: 12px; }
  .bp-step {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 12px; background: var(--bg2);
    border-radius: var(--r-md); margin-bottom: 8px;
    border-left: 3px solid var(--border);
  }
  .bp-step.tier0 { border-left-color: var(--green); }
  .bp-step.tier1 { border-left-color: var(--blue); }
  .bp-step.tier2 { border-left-color: var(--purple); }
  .bp-step.tier3 { border-left-color: var(--gold); }
  .bp-step-num { font-size: 11px; font-weight: 700; color: var(--text3); min-width: 18px; padding-top: 1px; }
  .bp-step-body { flex: 1; }
  .bp-step-title { font-size: 13px; font-weight: 500; color: var(--text1); margin-bottom: 3px; }
  .bp-step-detail { font-size: 12px; color: var(--text2); }
  .bp-arrow { text-align: center; color: var(--text3); font-size: 12px; margin-bottom: 6px; }
  .bp-final { background: #1a2e1f; border: 1px solid var(--green); border-radius: var(--r-md); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .no-path { text-align: center; padding: 24px; font-size: 13px; color: var(--text3); }
  .path-options { display: flex; flex-direction: column; gap: 10px; }
  .path-option-btn {
    background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r-md);
    padding: 10px 14px; cursor: pointer; text-align: left; transition: border-color 0.15s;
  }
  .path-option-btn:hover { border-color: var(--blue); }
  .path-option-btn.selected { border-color: var(--blue); background: var(--info-bg); }

// Refining recipes from the image (ratio stored as parts: [ingredient, parts])
// 2:1:1 means ingredient1*2 + ingredient2*1 + ingredient3*1 per unit of output
// We store ratios normalised to: to make 1 unit of output you need these ingredients
// Image table: Recipe=output, col2=x2, col1=x1, col1=x1
const REFINING_RECIPES = {
  Bron:          { ingredients: [["Cuprum",2],["Bleck",1],["Saburra Powder",1]] },
  Messing:       { ingredients: [["Cuprum",2],["Calamine",1],["Saburra Powder",1]] },
  "Tind Messing":{ ingredients: [["Messing",2],["Almine",1],["Gem Metal",1]] },
  "Grain Steel": { ingredients: [["Pig Iron",2],["Calx Powder",1],["Coke",1]] },
  Steel:         { ingredients: [["Grain Steel",2],["Coal",1],["Saburra Powder",1]] },
  Tungsteel:     { ingredients: [["Grain Steel",2],["Lupium",1],["Granum Powder",1]] },
  Cronite:       { ingredients: [["Grain Steel",2],["Almine",1],["Acronite",1]] },
  Oghmium:       { ingredients: [["Tungsteel",2],["Cronite",1],["Sanguinite",1]] },
};

// For the reverse search, we need to know which ore + recipe yields each ingredient.
// Build a lookup: material -> list of { ore, recipeIdx, ratio (per 10000 of ore) }
function buildExtractionIndex(allowDangerous) {
  const idx = {};
  const addEntry = (material, source) => {
    if (!allowDangerous && DANGEROUS_MACHINES.has(source.machine)) return;
    if (!idx[material]) idx[material] = [];
    idx[material].push(source);
  };
  Object.entries(RECIPES).forEach(([ore, recipes]) => {
    recipes.forEach((r, ri) => {
      Object.entries(r.outputs).forEach(([mat, ratio]) => {
        addEntry(mat, { type:"ore", ore, recipeIdx:ri, ratio, catalyst:r.catalyst, machine:r.machine });
      });
    });
  });
  Object.entries(SUB_RECIPES).forEach(([input, recipes]) => {
    recipes.forEach((r, ri) => {
      Object.entries(r.outputs).forEach(([mat, ratio]) => {
        addEntry(mat, { type:"sub", input, recipeIdx:ri, ratio, catalyst:r.catalyst, machine:r.machine });
      });
    });
  });
  return idx;
}

function BuffBar({ buffKey, setBuffKey }) {
  const BUFFS = [
    { key:"none", label:"No Buff", pct:null, cls:"" },
    { key:"cm",   label:"Clade + Mastery", pct:"+8.45%", cls:"active-cm" },

  ];
  const active = BUFFS.find(b => b.key === buffKey);
  return React.createElement('div', { className:'buff-bar' },
    React.createElement('span', { className:'buff-label' }, "⚡ Buff"),
    BUFFS.map(b =>
      React.createElement('button', {
        key:b.key, className:`buff-toggle${buffKey===b.key?' '+b.cls:''}`,
        onClick:()=>setBuffKey(b.key),
      },
        buffKey===b.key && React.createElement('span',{className:'dot'}),
        b.label,
        b.pct && React.createElement('span',{style:{opacity:.75,fontSize:11}},` ${b.pct}`)
      )
    ),
    buffKey!=="none" && React.createElement('span',{className:`buff-active-badge ${buffKey}`}, active.pct+" yield")
  );
}

function DangerBar({ allowDangerous, setAllowDangerous }) {

// Given a desired alloy and amount, work out how much of each intermediate
// ingredient is needed, then trace back to what raw ores produce those ingredients
// and the best (highest-ratio) recipe for each.

function computeIngredients(alloy, amount) {
  // Furnace yield = 35% of total input.
  // So: total_input = desired_output / 0.35
  // Each ingredient = total_input * (parts / sum_of_parts)
  const recipe = REFINING_RECIPES[alloy];
  if (!recipe) return null;
  const totalParts = recipe.ingredients.reduce((s,[,p])=>s+p, 0);
  const totalInput = amount / 0.35;
  return recipe.ingredients.map(([name,parts])=>({ name, needed: totalInput * (parts / totalParts) }));
}

// Find the best ore+recipe that yields a given material (highest ratio)
function bestSourceFor(material, allowDangerous) {
  const index = buildExtractionIndex(allowDangerous);
  const sources = index[material];
  if (!sources || sources.length===0) return null;
  return sources.reduce((best,s)=>s.ratio>best.ratio?s:best, sources[0]);
}

function ReverseSearchTab({ buffKey }) {
  const mult = BUFF_MULTIPLIERS[buffKey];
  const allowDangerous = useContext(DangerContext);
  const alloys = Object.keys(REFINING_RECIPES);
  const [alloy, setAlloy] = useState(alloys[0]);
  const [amount, setAmount] = useState("");
  const [result, setResult] = useState(null);

  function calculate() {
    const qty = parseFloat(amount.replace(/,/g,""));
    if (!qty || qty<=0) return;

    const ingredients = computeIngredients(alloy, qty);
    if (!ingredients) return;

    // Recursively resolve a material down to raw mineable ores.
    // Returns a flat map: { oreName -> { oreNeeded, stacks, machine, catalyst, ratio } }
    // visited prevents infinite loops
    function resolveToOre(material, needed, oreAcc, visited) {
      if (visited.has(material)) return;
      visited.add(material);

      // Is it a refining recipe (alloy)? Recurse into its sub-ingredients first.
      if (REFINING_RECIPES[material]) {
        const subIngredients = computeIngredients(material, needed);
        subIngredients.forEach(({ name: subName, needed: subNeeded }) => {
          resolveToOre(subName, subNeeded, oreAcc, new Set(visited));
        });
        return;
      }

      // Is it a sub-recipe product? Find best extraction source.
      const src = bestSourceFor(material, allowDangerous);
      if (src) {
        const yieldPerUnit = (src.ratio / 10000) * mult;
        const oreNeeded = needed / yieldPerUnit;
        const oreName = src.type === "ore" ? src.ore : src.input;

        // The source itself might be a sub-recipe output (e.g. Pig Iron from Blood Ore).
        // We want the mineable ore, so recurse if the source is not a top-level ore.
        if (src.type === "sub" && !RECIPES[src.input]) {
          resolveToOre(src.input, oreNeeded, oreAcc, new Set(visited));
        } else {
          const key = oreName;
          if (!oreAcc[key]) oreAcc[key] = { oreNeeded: 0, machine: src.machine, catalyst: src.catalyst, ratio: src.ratio };
          oreAcc[key].oreNeeded += oreNeeded;
          oreAcc[key].stacks = oreAcc[key].oreNeeded / 10000;
        }
        return;
      }

      // If material is itself a top-level ore (e.g. Saburra Powder from Saburra)
      // check if it appears as a direct extraction output
      // already handled above via bestSourceFor
    }

    // Build ingredient rows (for display)
    const rows = ingredients.map(({ name, needed }) => ({ name, needed }));

    // Build flat ore map by recursively resolving every ingredient
    const oreMap = {};
    ingredients.forEach(({ name, needed }) => {
      resolveToOre(name, needed, oreMap, new Set());
    });
    // Recalculate stacks after all additions
    Object.values(oreMap).forEach(o => { o.stacks = o.oreNeeded / 10000; });

    setResult({ alloy, qty, ingredients: rows, oreMap });
  }

  return React.createElement('div',null,
    React.createElement('div',{className:'rs-card'},
      React.createElement('div',{style:{marginBottom:12,fontSize:13,color:"var(--text2)"}},"Input your target alloy and desired quantity. The calculator works backwards to tell you how much raw ore you need."),
      React.createElement('div',{className:'rs-row'},
        React.createElement('div',{className:'rs-field',style:{flex:2}},
          React.createElement('span',{className:'rs-label'},"Target Alloy"),
          React.createElement('select',{value:alloy,onChange:e=>setAlloy(e.target.value)},
            alloys.map(a=>React.createElement('option',{key:a,value:a},a))
          )
        ),
        React.createElement('div',{className:'rs-field',style:{flex:2}},
          React.createElement('span',{className:'rs-label'},"Desired Amount"),
          React.createElement('input',{type:"text",placeholder:"e.g. 10000",value:amount,onChange:e=>setAmount(e.target.value),
            onKeyDown:e=>e.key==="Enter"&&calculate()})
        ),
        React.createElement('button',{className:'rs-btn',onClick:calculate},"Calculate")
      ),

      result && React.createElement('div',{className:'rs-result'},
        // Recipe breakdown
        React.createElement('div',{className:'rs-section-title',style:{color:"var(--blue)"}},"📋 Recipe — to make "+fmt(result.qty)+" "+result.alloy),
        React.createElement('div',{style:{marginBottom:4,fontSize:11,color:"var(--text3)"}},
          REFINING_RECIPES[result.alloy].ingredients.map(([n,p])=>`${p}× ${n}`).join(" + ")+" → "+result.alloy
        ),

        // Ingredients needed
        React.createElement('div',{style:{marginTop:14}}),
        React.createElement('div',{className:'rs-section-title',style:{color:"var(--green)"}},"🧪 Ingredients Needed"),
        result.ingredients.map(r=>
          React.createElement('div',{key:r.name,className:'rs-ingredient-row'},
            React.createElement('span',null,r.name),
            React.createElement('span',{className:'badge badge-green'},fmt(r.needed))
          )
        ),

        // Ore sources
        React.createElement('div',{className:'rs-ore-section'},
          React.createElement('div',{className:'rs-section-title',style:{color:"var(--gold)"}},"⛏ Raw Mineable Ore Required"),
          buffKey!=="none"&&React.createElement('div',{style:{fontSize:11,color:"var(--text3)",marginBottom:8}},"⚡ Buff applied: "+BUFF_MULTIPLIERS[buffKey]+" multiplier"),
          Object.keys(result.oreMap).length === 0
            ? React.createElement('div',{style:{fontSize:13,color:"var(--text3)",padding:"10px 0"}},"Could not trace ingredients back to mineable ores.")
            : Object.entries(result.oreMap).map(([ore,info])=>
                React.createElement('div',{key:ore,style:{paddingBottom:8,borderBottom:"0.5px solid var(--border)",marginBottom:8}},
                  React.createElement('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}},
                    React.createElement('span',{style:{fontSize:14,fontWeight:500,color:"var(--text1)"}},ore),
                    React.createElement('div',{style:{display:"flex",gap:6,alignItems:"center"}},
                      React.createElement('span',{className:'badge badge-gold'},fmt(info.oreNeeded)+" units"),
                      React.createElement('span',{className:'badge badge-blue'},fmt(info.stacks)+" stacks")
                    )
                  ),
                  React.createElement('div',{style:{fontSize:11,color:"var(--text3)"}},
                    `${MACHINE_ICONS[info.machine]||"⚙"} ${info.machine} · Catalyst: ${info.catalyst} · Ratio: ${(info.ratio/100).toFixed(2)}%`)
                )
              )
        )
      )
    )
  );
}

// Graph traversal: given a starting ore/amount and a target material,
// find all paths through extraction + sub-recipes that lead to that target.

// Build a forward graph: material -> [ {to, ratio, machine, catalyst, recipeIdx, source} ]
function buildForwardGraph(allowDangerous) {
  const graph = {};
  const addEdge = (from, to, meta) => {
    if (!allowDangerous && DANGEROUS_MACHINES.has(meta.machine)) return;
    if (!graph[from]) graph[from] = [];
    graph[from].push({ to, ...meta });
  };
  Object.entries(RECIPES).forEach(([ore, recipes]) => {
    recipes.forEach((r, ri) => {
      Object.entries(r.outputs).forEach(([mat, ratio]) => {
        addEdge(ore, mat, { ratio, machine:r.machine, catalyst:r.catalyst, recipeIdx:ri });
      });
    });
  });
  Object.entries(SUB_RECIPES).forEach(([input, recipes]) => {
    recipes.forEach((r, ri) => {
      Object.entries(r.outputs).forEach(([mat, ratio]) => {
        addEdge(input, mat, { ratio, machine:r.machine, catalyst:r.catalyst, recipeIdx:ri });
      });
    });
  });
  return graph;
}

// DFS to find all paths from start to target (max depth 8)
function findAllPaths(start, target, graph, maxDepth=8) {
  const paths = [];
  function dfs(node, path, visited) {
    if (path.length > maxDepth) return;
    if (node === target) { paths.push([...path]); return; }
    const edges = graph[node] || [];
    edges.forEach(edge => {
      if (!visited.has(edge.to)) {
        visited.add(edge.to);
        path.push(edge);
        dfs(edge.to, path, visited);
        path.pop();
        visited.delete(edge.to);
      }
    });
  }
  dfs(start, [], new Set([start]));
  return paths;
}

// Compute final yield for a path given starting qty
function pathYield(path, startQty, mult) {
  let qty = startQty;
  path.forEach(edge => {
    qty = qty * (edge.ratio / 10000) * mult;
  });
  return qty;
}

  const mult = BUFF_MULTIPLIERS[buffKey];

  const ores = Object.keys(RECIPES);
  // Collect all possible targets (everything that can be produced)
  const allTargets = [...new Set([
    ...Object.values(RECIPES).flatMap(rs=>rs.flatMap(r=>Object.keys(r.outputs))),
    ...Object.values(SUB_RECIPES).flatMap(rs=>rs.flatMap(r=>Object.keys(r.outputs))),
  ])].sort();

  const [ore, setOre] = useState(ores[0]);
  const [target, setTarget] = useState("Skadite");
  const [amount, setAmount] = useState("");
  const [paths, setPaths] = useState(null);

  function calculate() {
    const qty = parseFloat(amount.replace(/,/g,""));
    if (!qty || qty<=0) return;
    const graph = buildForwardGraph(allowDangerous);
    const found = findAllPaths(ore, target, graph);
    if (found.length===0) { setPaths([]); return; }
    const scored = found.map((p,i)=>({ path:p, yield: pathYield(p,qty,mult), idx:i }))
      .sort((a,b)=>b.yield-a.yield);
    setPaths(scored);

      ),

        // Path selector when multiple options exist
        paths.length > 1 && React.createElement('div',{style:{marginBottom:14}},
          React.createElement('div',{style:{fontSize:11,textTransform:"uppercase",letterSpacing:"0.07em",color:"var(--text3)",marginBottom:8}},"Found "+paths.length+" paths — sorted by yield"),
          React.createElement('div',{className:'path-options'},
            paths.slice(0,5).map((p,i)=>
              React.createElement('button',{
                key:i, className:`path-option-btn${selectedPath===i?" selected":""}`,

                  React.createElement('span',{style:{fontSize:13,color:"var(--text1)"}},
                    (i===0?"🏆 Best: ":"Path "+(i+1)+": ")+p.path.map(e=>e.to).join(" → ")),

        React.createElement('div',{style:{marginTop:14}},

  const [buffKey, setBuffKey] = useState("none");

  const mult = BUFF_MULTIPLIERS[buffKey];

  const TABS = [
    { key:"extract", label:"⛏ Extraction" },

    { key:"bestpath", label:"🏆 Best Path" },
  ];

  return React.createElement(BuffContext.Provider,{value:mult},
    React.createElement(DangerContext.Provider,{value:allowDangerous},
      React.createElement('div',{style:{padding:"1rem 0",maxWidth:720,margin:"0 auto"}},

        React.createElement('p',{style:{fontSize:13,color:"var(--text2)",marginBottom:16}},"Extract, refine, and plan your material chains."),
        React.createElement('div',{className:'tabs'},
